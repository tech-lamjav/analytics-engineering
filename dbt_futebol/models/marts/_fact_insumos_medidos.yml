version: 2

models:
  - name: fact_insumos_medidos
    description: >
      Entrega 3 do #147/#148 (AE#175, ADR 0016), estendida ao Handicap pela AE#202. Cópia
      achatada, escalar, de `insumos_medidos` de `int_futebol_premissas_1x2` e
      `int_futebol_premissas_ah` — o ARRAY<STRUCT> que a Entrega 2 (AE#153, ADR 0014)
      publica não atravessa o sync BQ->Postgres (pula toda coluna REPEATED/RECORD). 1 linha
      por (fixture_id, outcome, market, line_value, premissa, insumo) aplicável à linha. No
      Handicap, uma linha por linha de handicap, com o valor repetido: o que muda entre as
      linhas é quais premissas se aplicam (favorito ou azarão).
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Draw', 'Away']
      - name: market
        description: "Slug de futebol_mercados_pontuados() — 'match_winner' (1X2) ou 'asian_handicap' (AE#202), não um literal '1X2'/'AH'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['match_winner', 'asian_handicap']
      - name: line_value
        description: "NULL no 1X2, que não tem linha. No Handicap (AE#202), o handicap na ótica do MANDANTE — o mesmo line_value do funil e do board, igual para Home e Away."
      - name: premissa
        description: "Slug do catálogo futebol_insumos_premissa() — mesmo nome de int_futebol_premissas_1x2 e de fact_value_opportunities.evidencias."
        tests: [not_null]
      - name: insumo
        description: "Nome do insumo, literalmente o mesmo de Insumo declarado/Regime do insumo (CONTEXT.md) — a chave que cruza esta linha com o regime declarado no catálogo."
        tests: [not_null]
      - name: valor
        description: "O número que a premissa comparou. Pode ser NULL — insumo existia e não tinha dado, não que o insumo não exista (Insumo medido, CONTEXT.md)."
    tests:
      # Grão completo — os SEIS campos que a ADR 0016 declara como o grão congelado, não só
      # os quatro que o 1X2 hoje varia. market/line_value entram aqui mesmo constantes: é
      # exatamente a garantia que a ADR promete (grão pronto pro segundo mercado) — sem eles
      # na combinação, uma futura linha que difira só em market/line_value pro mesmo
      # (fixture, outcome, premissa, insumo) passaria batido.
      #
      # tag:guarda desde a AE#202: a tabela entrou no `--select` dos dois workflows que
      # reconstroem os pais (DE#85, 16/09), a condição que a AE#175 deixou para ligar a tag.
      # Com o Handicap, esta é a guarda que pega line_value errado (duas linhas de handicap
      # caindo na mesma chave).
      - dbt_utils.unique_combination_of_columns:
          config:
            tags: ['guarda']
          arguments:
            combination_of_columns:
              - fixture_id
              - outcome
              - market
              - line_value
              - premissa
              - insumo
