version: 2

models:
  - name: fact_value_funnel
    description: >
      O FUNIL DE AVALIAÇÃO (#95, ADR 0011 + ADR 0006). 1 linha por
      (fixture_id, market, outcome, line_value, janela) que TEVE PREÇO naquela janela, nos
      cinco mercados pontuados — e NADA filtrado. Onde o `fact_value_opportunities` guarda
      só o que passa, este guarda todo candidato com o veredito de cada porta em coluna
      própria, e é dele que sai a pergunta que a task [A] inteira precisa responder:
      quantas linhas cada porta remove SOZINHA, e quantas ela ainda remove DEPOIS das
      anteriores.

      Duas rejeições que hoje são SUMIÇO passam a ser linha com carimbo: o conjunto de
      saídas incompleto (a maior do sistema, ~49% do universo), que vivia num `WHERE`
      dentro do join de cada ramo do board; e a saída "12" da Dupla Chance — precificada,
      não pontuada —, que o `INNER JOIN` com as premissas engolia.

      ⚠️ DESDE A #97 (o flip) O BOARD **É** ESTA TABELA FILTRADA: o
      `fact_value_opportunities` lê daqui e aplica `janela_e_corrente AND passou_no_gate`
      mais o expurgo da #85. Não há mais o que provar sobre o funil "descrever" o board, e
      por isso a `assert_funil_paridade_com_board` foi APOSENTADA no mesmo commit — depois
      do flip ela compararia a tabela consigo mesma, e guarda que não pode falhar é ruído
      com cara de cobertura.

      Quem prova que o universo está inteiro continua sendo
      `assert_funil_reconcilia_com_devig`, que lê a FONTE (o de-vig) e nunca o próprio
      funil — essa pergunta o flip não responde.

      ⚠️ APPEND-ONLY, CONGELADO NO APITO (#96, ADR 0011). A linha é escrita e atualizada
      enquanto o `kickoff` do fixture está no FUTURO, e nenhuma escrita acontece depois
      dele: o funil não é uma foto do que o código de hoje diria, é registro do que o Motor
      disse. É o que faz a A7 valer a pena entrar ANTES da A1 — quando o preço sair da nota
      e as portas mudarem, o funil de antes continua exatamente como estava.

      ⚠️ `full_refresh=false` NO CONFIG, e é load-bearing: a fase de RECOVERY do
      `workflow_futebol_odds` roda o mesmo `--select` com `--full-refresh`. Sem essa trava,
      a primeira recuperação de deriva determinística apagaria o histórico inteiro — em
      silêncio, e com o job verde.

      ⚠️ RETENÇÃO: **não há expurgo do funil**. São ~45 mil linhas/mês; dez anos de operação
      com o dobro de ligas não chegam a 10 milhões de linhas nem a 5 GB. A política se
      revisita se a tabela passar de 10 milhões de linhas — que é uma forma de dizer que ela
      não se revisita. O expurgo continua sendo do board (ADR 0009), e o funil guarda jogo
      encerrado DE PROPÓSITO: é ele que responde quanto rendeu a faixa descartada.

      ⚠️ NÃO VAI PARA O SUPABASE (ADR 0006/0011): o app não lê funil. Sem migração no
      Postgres, sem RPC, sem tocar `check_schema_parity`.

      ⚠️ Quem for CONTAR o funil precisa fixar UMA janela por candidato antes de contar
      (`janela_e_corrente`, ou a janela que a análise escolher). Contando as quatro, todo
      número infla até 4×.
    columns:
      # ------------------------------------------------------------------ chave e grão
      - name: fixture_id
        description: "Jogo. Vem do de-vig, não de `fact_fixtures` — o funil não perde linha por fixture ausente."
        tests: [not_null]
      - name: market
        description: "Os cinco mercados pontuados. O mercado 6 (Gols O/U do 1º tempo) fica FORA do universo: não existe modelo de premissa para ele (ADR 0011). A lista mora em `macros/futebol_funil.sql`."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['match_winner', 'goals_over_under', 'asian_handicap', 'btts', 'double_chance']
      - name: outcome
        description: >
          A saída precificada. Inclui a "12" da Dupla Chance, que o Motor NÃO pontua — ela
          entra com `porta_saida_catalogada = FALSE`, porque teve preço e a decisão de não
          pontuá-la é nossa (ADR 0011). Por isso a lista aqui é MAIOR que a do board.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Draw', 'Away', 'Over', 'Under', 'Yes', 'No', '1X', '12', 'X2']
      - name: lado
        description: >
          O LADO APOSTADO (#105, ADR 0005) — o eixo do denominador congelado, e o que o
          `outcome` sozinho não diz. São ONZE pares de (mercado, lado), derivados num lugar
          só por `macros/futebol_lado.sql`, lido também pela medição que produziu o seed e
          pela guarda que o vigia.

          ⚠️ No Handicap ele NÃO é o `outcome`. `line_value` vem na ótica do MANDANTE e é o
          mesmo para Home e Away (par complementar), então o handicap na ótica do lado
          apostado é `IF(side = 'Home', line, -line)` e o SINAL dele separa `Favorito` de
          `Azarao` — conjuntos de premissa disjuntos, Σ40 contra Σ30. Handicap zero é
          `Pick`: nenhuma premissa se aplica.

          ⚠️ Na Dupla Chance 1X e X2 colapsam em `unico`, porque as quatro premissas se
          aplicam às duas saídas — dois denominadores ali seriam duas medições do mesmo
          número, cada uma com metade da amostra.

          ⚠️ NULL na saída não catalogada (a "12"), pelo mesmo fail-closed do
          `futebol_market_slug`. É o NULL que a mantém fora da cobrança de cobertura da
          guarda — a decisão de não pontuá-la já está carimbada na `porta_saida_catalogada`.

          ⚠️ NULL TAMBÉM, e para sempre, nas linhas de jogo que já tinham apitado quando
          esta entrega subiu: a coluna chega por `append_new_columns` e o funil não
          reescreve o passado (ADR 0011). Por isso a guarda DERIVA o lado do macro em vez
          de ler esta coluna.
      - name: line_value
        description: "NULL no 1X2, BTTS e Dupla Chance; a linha L (1.5/2.5/...) no Gols O/U; o handicap na ótica do mandante (o mesmo p/ Home e Away) no Handicap asiático."
      - name: line_key
        description: >
          `line_value` como STRING, com NULL virando 'NONE'. É a coluna do grão que entra
          na `unique_key` do merge, e ela existe por um motivo mecânico: num `MERGE ... ON`
          NULL nunca casa com NULL, então `line_value` cru na chave faria toda linha de
          1X2, BTTS e Dupla Chance ser reinserida a cada execução — em silêncio, até a
          guarda de grão acender.
        tests: [not_null]
      - name: janela
        description: "A janela de coleta que originou esta avaliação. São QUATRO por candidato (daily < t24h < t1h < t15m), não três — a `daily` entrou em 07/08/2026. É a quarta coluna do grão."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['daily', 't24h', 't1h', 't15m']
      - name: janela_prioridade
        description: "A ordem declarada das janelas (`futebol_janela_prioridade()`), 1=daily .. 4=t15m. Ordenar pelo NOME diria que 'daily' < 't15m' < 't1h' < 't24h'."
      - name: janela_e_corrente
        description: >
          TRUE na janela mais recente coletada deste (fixture, mercado, linha) — a que o
          board publicaria. É REDUÇÃO, não veredito: fica FORA de `passou_no_gate` de
          propósito (ADR 0011, D8), senão toda taxa de rejeição do funil passaria a incluir
          três janelas que ninguém rejeitou.
        tests: [not_null]

      # ------------------------------------------------------------------- as oito portas
      - name: porta_saida_catalogada
        description: "TRUE = a saída é pontuada pelo Motor. FALSE só na \"12\" da Dupla Chance, hoje. É a porta que existe para que uma saída precificada e não modelada seja um DESCARTE registrado, e não um sumiço."
        tests: [not_null]
      - name: porta_cobertura_pinnacle
        description: >
          TRUE = a Pinnacle precifica o conjunto de saídas inteiro deste mercado
          (`pin_n_outcomes >= N`), em 1X2 (3), Handicap e Gols (2 cada) — INDEPENDENTE de
          qual fonte a linha realmente usou (Pinnacle ou fallback de consenso). A Pinnacle
          não precifica BTTS nem tem eixo próprio na Dupla Chance, então nesses dois a
          porta é TRIVIALMENTE TRUE (mesmo padrão de `porta_odd_dc` fora da DC).

          ⚠️ RENOMEADA NA #118 (opção 1, 31/08). Chamava-se `porta_conjunto_completo` e o
          nome mentia de duas formas: (a) em AH/Gols ela reprovava linha de consenso com
          preço válido só porque a PINNACLE especificamente não cobriu — 9.102 linhas de
          Handicap e 10.644 de Gols, todas de consenso, tinham `porta_valor_estimavel =
          TRUE` e a porta velha `= FALSE`; (b) em BTTS/DC ela usava `n_outcomes_valor >=
          N`, que é uma cópia disfarçada de `porta_valor_estimavel` (zero divergência
          medida em 8.525 linhas) e não testava nada próprio. `passou_no_gate` não mudou
          em nenhuma linha — só o nome e a lógica dos dois ramos redundantes.
        tests: [not_null]
      - name: porta_valor_estimavel
        description: >
          TRUE = há `prob_justa_fechamento` — a regra da ADR 0002
          (`n_outcomes_valor = conjunto_esperado`). Independente de `porta_cobertura_pinnacle`
          — as duas fazem perguntas diferentes (ver a #118 para o porquê do nome antigo
          confundir isso) e não são aninhadas.
        tests: [not_null]
      - name: porta_liquidez
        description: >
          TRUE = `n_casas >= 3`. É a porta EM VIGOR, e continua sendo — a A3 não a
          redefiniu. O mínimo de 4 que a A3 decidiu vive na coluna irmã
          `porta_liquidez_estrita`, fora da conjunção, e a virada (#109) troca qual das
          duas está no gate. Redefinir esta aqui faria um nome de coluna valer >= 3 nas
          linhas já congeladas e >= 4 nas novas, para sempre, dentro de uma tabela
          append-only.
        tests: [not_null]
      - name: porta_edge
        description: "TRUE = `edge > 0`, ou `> consensus_min_edge` (3%) quando o valor vem do consenso — o edge de consenso é enviesado p/ cima (best_odd é o MÁXIMO das casas contra a prob da MEDIANA). (A A2 tira o edge do gate.)"
        tests: [not_null]
      - name: porta_nota
        description: "TRUE = `score >= 40`. Nota NULL (saída sem premissa a avaliar) reprova aqui — é a porta que absorve o que o `INNER JOIN` do board descartava."
        tests: [not_null]
      - name: porta_linha_meia
        description: "TRUE = a linha é meia (.5, sem push/meio-push). Só se aplica a Handicap asiático e Gols O/U; nos outros três passa trivialmente, porque a porta não se aplica — não porque a linha foi isentada."
        tests: [not_null]
      - name: porta_odd_dc
        description: >
          TRUE = `best_odd >= 1,25`. Gate de odd PRÓPRIO da Dupla Chance (que por isso não
          aplica a penalidade de juice). Trivialmente TRUE nos outros quatro mercados.
          ⚠️ O 1,25 deixou de ser literal na #104 e passou a sair da var `faixa_odd_dc_min`,
          a MESMA que a `porta_faixa_odd` usa como piso da DC — o número existe num lugar
          só, e mexer nele não pode mover uma porta e esquecer a outra.
        tests: [not_null]
      - name: passou_no_gate
        description: >
          A CONJUNÇÃO das oito portas EM VIGOR, DERIVADA e nunca escrita à mão (ADR 0006).
          Não inclui `janela_e_corrente` (redução, não veredito), nem o expurgo do board
          (o funil guarda jogo encerrado de propósito — é ele que responde quanto rendeu a
          faixa descartada), nem as três barreiras MEDIDAS da #104, que ainda não estão em
          vigor. A expressão é byte a byte a de antes da #104: é assim que "o board não muda
          de volume nem de composição" é verdade por CONSTRUÇÃO, e não por medição.
        tests: [not_null]

      # ------------------------------------- as três barreiras MEDIDAS (#104, A3+A5)
      # Fora de `passou_no_gate`. Dizem quem PASSARIA; quem as põe em vigor é a virada (#109).
      # ⚠️ Chegam por append_new_columns e ficam NULL para sempre na linha de jogo já apitado
      # antes do deploy — append-only funcionando, igual a nota_contexto (A1) e
      # score_normalizado (A6). Por isso não levam `not_null`.
      - name: porta_liquidez_estrita
        description: >
          TRUE = `n_casas >= 4` (var `liquidez_min_casas`). A barreira de liquidez que a A3
          decidiu, MEDIDA e fora da conjunção. Convive com `porta_liquidez` (>= 3, em vigor)
          em vez de substituí-la: o funil é append-only, e redefinir o predicado sob o mesmo
          nome faria a coluna valer duas coisas em duas eras da mesma tabela. A virada troca
          qual das duas está no gate, sem renomear nada.
      - name: porta_outlier
        description: >
          TRUE = a odd NÃO está fora da curva — `NOT pen_odd_outlier`, isto é,
          `best_odd < 1,10 × média das demais casas`. O `pen_odd_outlier` deixa de dar
          penalidade e vira barreira na virada. ⚠️ A barreira elimina A LINHA, não a casa:
          descartar a casa fora da curva e publicar a segunda melhor odd mudaria o
          `best_odd` de todo o board, o edge exibido e o CLV histórico — é feature nova, fora
          de escopo. ⚠️ COALESCE por FORA do NOT: penalidade ausente (NULL) REPROVA a
          barreira, em vez de aprovar por acidente de negação.
      - name: porta_faixa_odd
        description: >
          TRUE = `best_odd` está na faixa do mercado, com fronteiras INCLUSIVAS nas duas
          pontas (odd exatamente igual ao piso ou ao teto PASSA — escrito porque este repo já
          teve knife-edge de float, na #92):

          | mercado | piso | teto | vars |
          |---|---|---|---|
          | Resultado, Handicap, Gols, Ambos marcam | 1,50 | 4,00 | `faixa_odd_min` / `faixa_odd_max` |
          | Dupla chance | 1,25 | 2,00 | `faixa_odd_dc_min` / `faixa_odd_dc_max` |

          O piso existe porque abaixo dele a margem embutida no mercado come o lucro
          possível (92% no Handicap e 106% no Gols em odd até 1,30). ⚠️ O teto de 4,00 é
          DECISÃO DE PRODUTO e o único número da [A] sem medição atrás — registrado como tal
          para não ser defendido depois como se tivesse. A Dupla Chance tem faixa própria
          porque é mercado de proteção e as odds vivem em outra faixa.
      - name: motivo_primario
        description: >
          CONVENIÊNCIA DE LEITURA, NÃO FONTE (ADR 0006). A primeira porta reprovada na
          ordem de leitura declarada; NULL quando a linha passou. Uma linha reprova em
          várias portas ao mesmo tempo, e é justamente a leitura marginal — isolada vs.
          depois das anteriores — que dá valor à tabela: quem for medir porta lê os oito
          booleanos, nunca esta coluna.

          ⚠️ `'conjunto_incompleto'` é um valor LEGADO (pré-#118, pré-31/08): 69.019 linhas
          já congeladas no apito carregam esse rótulo para sempre — é o append-only
          funcionando (ADR 0011), não sujeira. Recomputar essas linhas violaria o próprio
          contrato da tabela. Toda linha nova usa `'sem_cobertura_pinnacle'`.
        tests:
          - accepted_values:
              arguments:
                values: ['saida_nao_catalogada', 'sem_cobertura_pinnacle', 'valor_nao_estimavel',
                         'sem_liquidez', 'sem_edge', 'nota_abaixo_da_regua', 'sem_lado_apostado',
                         'linha_nao_meia', 'odd_dc_abaixo_do_minimo',
                         'conjunto_incompleto']  # legado pré-#118, congelado em linha já apitada
      - name: sem_lado_apostado
        description: >
          O empate do 1X2 (ADR 0005/0006). Marca ESTRUTURAL — o mercado e a saída —, nunca
          "a nota deu zero": sem lado apostado nenhuma premissa dispara, e um terço do
          universo do 1X2 está em zero POR CONSTRUÇÃO. Sob o motivo genérico esse terço
          apareceria como "nota abaixo da régua" e a régua pareceria mais severa no 1X2 do
          que é.
        tests: [not_null]

      # --------------------------------------------------------------------- o payload
      - name: kickoff_utc
        description: >
          O apito, em UTC. Eixo de toda análise por horizonte e — na próxima entrega — a
          fronteira do congelamento (ADR 0011). NULL quando o fixture não existe em
          `fact_fixtures`: o join é LEFT de propósito, porque perder a linha seria a perda
          silenciosa que a tabela existe para impedir.
      - name: score
        description: "A MESMA nota do board: clamp(pts_valor + pts_premissas + pts_corroboracao − penalidades, 0, 100). NULL onde não houve premissa a avaliar (a \"12\" da DC) — e o NULL morre na `porta_nota`, que é NULL-safe."
      - name: nota_contexto
        description: >
          A NOTA DEPOIS QUE O PREÇO SAIU DELA (#103, ADR 0012):
          `GREATEST(pts_premissas − penalidades_especificas_pts, 0)`, e nada mais. Sem
          `pts_valor`, sem corroboração e sem as quatro penalidades de odd. As quatro
          penalidades que continuam dentro são de CONTEXTO — `pick_empate` (−10),
          `desfalque_proprio` (−15), `linha_extrema` (−10, Gols) e `handicap_alto` (−12,
          Handicap): `linha_extrema` e `handicap_alto` leem a LINHA, que é característica
          do mercado apostado e não do preço dele.

          ⚠️ NASCE AO LADO DO `score`, não no lugar dele. Nesta entrega o board não muda
          de gate nem de número — cada passo da [A] é medível no funil enquanto o produto
          segue no gate antigo, e existe UMA virada só, no fim. Quem lê esta coluna hoje é
          a medição.

          ⚠️ A composição mora em `macros/futebol_nota_contexto.sql`, num lugar só, e é
          consumida pelo funil e pela guarda de reconstrução — nunca copiada. Duas guardas
          a protegem: `assert_nota_contexto_sem_preco` (sentinela da decisão, varre o
          TEXTO da composição) e `assert_funil_nota_contexto_reconstroi` (a coluna gravada
          bate com a recomposta, em toda linha ainda gravável).

          ⚠️ NULL, e não zero, onde não houve premissa a avaliar (a "12" da Dupla Chance):
          `GREATEST(NULL, 0)` é NULL no BigQuery, que é a ADR 0003 acontecendo sozinha.

          ⚠️ NULL TAMBÉM, e para sempre, nas linhas de jogo que já tinham apitado quando a
          A1 subiu. A coluna chega por `append_new_columns` e o funil só escreve linha de
          jogo futuro (ADR 0011): a história congelada não recebe a nota nova. É o
          append-only funcionando — o dia da virada fica legível na série sem ninguém
          precisar lembrar a data —, e é por isso que a guarda de reconstrução é escopada
          ao que ainda é gravável.

          ⚠️ FICA FORA do payload da `assert_funil_paridade_com_board` de propósito: é
          coluna do funil e o board não a tem. Comparar o que só existe de um lado
          deixaria a guarda vermelha por desenho.
      - name: score_normalizado
        description: >
          A NOTA NORMALIZADA (#105, ADR 0005): a `nota_contexto` dividida pelo p95
          OBSERVADO do `lado`, em 0–100 —
          `LEAST(100, ROUND(nota_contexto / p95 × 100))`. O serviço dela é fazer o 100
          significar a MESMA COISA nos onze lados: sem ela, a nota é dividida por uma soma
          de pesos que nunca ocorre, e quanto mais premissa um mercado tem, mais baixa é a
          nota dele — o mercado onde se investiu mais modelagem é o mais punido.

          O denominador vem do seed versionado `futebol_p95_nota_contexto`, medido UMA VEZ
          sobre uma janela declarada e congelado. Recalcular em runtime faria a régua
          significar coisa diferente a cada dia e mataria toda comparação histórica.

          ⚠️ A nota é ABSOLUTA — quanta evidência acendeu —, nunca percentil dentro do
          lado. A alternativa relativa foi rejeitada porque garante volume de publicação
          independente de qualidade, contradiz a degradação graciosa e envenena o funil (a
          rejeição passaria a ser X% por construção). O preço, declarado em voz alta: **os
          mercados publicam em taxas diferentes, e isso é consequência, não defeito.**

          ⚠️ ~5% das linhas de cada lado batem em 100 POR CONSTRUÇÃO. O denominador é o
          quantil 95; o `LEAST(100, ...)` as trava ali, e isso não é erro.

          ⚠️ DENOMINADOR ZERO ⇒ ZERO EXPLÍCITO, nunca `SAFE_DIVIDE`. São os dois lados sem
          lado apostado — o empate do 1X2 e o `Pick` do Handicap. O `SAFE_DIVIDE`
          devolveria NULL, a comparação com a régua também viraria NULL, e a linha sairia
          sem passar e sem ser marcada: descarte silencioso é o que a ADR 0006 proíbe. O
          mesmo ramo cobre o denominador AUSENTE (lado fora do seed) — a linha vira zero e
          reprova visivelmente, e quem acende é a guarda de cobertura.

          ⚠️ NULL, e não zero, onde não houve premissa a avaliar (a "12" da DC), pelo mesmo
          motivo que o `score` e a `nota_contexto` (ADR 0003). E NULL para sempre nas
          linhas já congeladas antes desta entrega, como a `nota_contexto`.

          ⚠️ NÃO é o número do board, e não é o gate. O board segue no `score` e na régua
          de 40 até a virada, no fim da [A]. Fica FORA do payload da
          `assert_funil_paridade_com_board` pelo mesmo motivo que a `nota_contexto`.

          A aritmética mora em `macros/futebol_score_normalizado.sql`, sem argumento, pela
          mesma razão do macro da nota de contexto; o unit test
          `funil_nota_normalizada_pelo_p95_congelado` a percorre inteira.
      - name: pts_premissas
        description: "NULL, e não zero, onde não houve premissa a avaliar. Zero seria \"foi avaliada e tirou zero\", que é outra coisa (ADR 0003)."
      - name: premissas_sem_dado
        description: "Quantas premissas aplicáveis à linha não puderam ser avaliadas por falta de insumo (#41, ADR 0003). Não entra na nota: é o que a nota NÃO pôde levar em conta. NULL onde não houve premissa nenhuma."
      - name: edge
        description: "EV/edge = best_odd * prob_justa − 1. Ao contrário do board, aqui ele NÃO é garantidamente positivo: o funil guarda o que a porta de edge rejeitou."
      - name: valor_fonte
        description: "'pinnacle' (mercados 1/4/5; e Dupla Chance, derivada do 1X2 da Pinnacle) ou 'consenso' (mediana das casas — BTTS). NULL em linha cujo conjunto de saídas veio incompleto: sem conjunto não há estimativa (ADR 0002)."
        tests:
          - accepted_values:
              arguments:
                values: ['pinnacle', 'consenso']
      - name: is_half_line
        description: "TRUE só se a linha é meia (.5); FALSE p/ cheia (x.0) e p/ os DOIS quartos (.25 e .75); NULL onde não há linha. Insumo cru da `porta_linha_meia`. Predicado em `futebol_e_linha_meia()`; até a #101 a linha de quarto .25 saía TRUE aqui."
      - name: pen_odd_outlier
        description: "Parcela da penalidade global: best_odd >= 1,10 × média das OUTRAS casas (−30)."
      - name: pen_poucas_casas
        description: "Parcela da penalidade global: n_casas < 4 (−12)."
      - name: pen_odd_longshot
        description: "Parcela da penalidade global: best_odd > 4,5 (−15)."
      - name: pen_odd_juice
        description: "Parcela da penalidade global: best_odd < 1,40 (−10). FALSE na Dupla Chance de propósito — o gate de odd próprio (>= 1,25) já cobre o retorno mínimo."

      # ------------------------------------------------------------------ os carimbos
      - name: gravado_em
        description: >
          QUANDO o Motor disse isto (#96). Sob append-only, "quando o dbt carregou" e
          "quando ficou registrado" são o mesmo instante — por isso este campo substituiu
          o `dbt_loaded_at` em vez de conviver com ele. Em linha `corrente` ele é sempre
          ANTERIOR ao `kickoff_utc`, e é isso que a `assert_funil_congelado_no_apito` prova.
        tests:
          # `tag:guarda` porque o agendado roda SÓ essa seleção. Carimbo nulo é o sintoma
          # exato da cutover malfeita (merge sobre a tabela do passo 1), e sem a tag ele
          # ficaria mudo justamente no dia em que precisa gritar.
          - not_null:
              config:
                tags: ['guarda']
      - name: origem
        description: >
          `backfill` no build que CRIA a tabela — aquelas linhas foram recalculadas com o
          código de hoje sobre odds antigas, e são a única parte do funil que NÃO é
          registro do que foi dito na época. `corrente` em toda escrita incremental, e essa
          sim é registro de época. Com o carimbo, o dia da virada da A1 fica legível na
          série sem ninguém precisar lembrar a data.

          ⚠️ Linha `backfill` de jogo ainda futuro vira `corrente` no primeiro merge
          seguinte — ela voltou a ser escrita antes do apito, então passou a ser registro
          de época de verdade.
        tests:
          # idem `gravado_em`: `tag:guarda` porque é o carimbo que denuncia a cutover
          # malfeita, e o agendado só roda essa seleção.
          - not_null:
              config:
                tags: ['guarda']
          - accepted_values:
              arguments:
                values: ['backfill', 'corrente']
              config:
                tags: ['guarda']
    tests:
      # O GRÃO — e aqui ele inclui a JANELA, ao contrário do board (ADR 0004/0011).
      #
      # `tag:guarda` porque esta é a única propriedade da tabela que nenhuma outra guarda
      # cobre: a `assert_funil_reconcilia_com_devig` compara CONJUNTOS de chaves com
      # `EXCEPT DISTINCT`, que é insensível a duplicata — um fan-out que duplicasse toda
      # linha passaria por ela nos dois sentidos e só apareceria aqui.
      #
      # ⚠️ Sobre `line_key` e não `line_value`: as duas dão o mesmo grão (uma é função
      # determinística da outra, e o BigQuery agrupa NULLs), mas é `line_key` que entra na
      # `unique_key` do merge. Testando a chave REAL, esta é literalmente a guarda que o
      # comentário do modelo promete — a que acende se o merge parar de casar e passar a
      # inserir.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - market
              - outcome
              - line_key
              - janela
          config:
            tags: ['guarda']
