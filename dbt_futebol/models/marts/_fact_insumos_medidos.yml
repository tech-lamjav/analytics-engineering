version: 2

models:
  - name: fact_insumos_medidos
    description: >
      Entrega 3 do #147/#148 (AE#175, ADR 0016), estendida ao Handicap pela AE#202, ao Ambos
      marcam pela AE#208 e à Dupla chance pela AE#209. Cópia achatada, escalar, de `insumos_medidos` dos modelos de
      premissas listados em `futebol_mercados_com_insumos_medidos()` — o ARRAY<STRUCT> que a
      Entrega 2 (AE#153, ADR 0014) publica não atravessa o sync BQ->Postgres (pula toda
      coluna REPEATED/RECORD). 1 linha por (fixture_id, outcome, market, line_value,
      premissa, insumo) aplicável à linha. No Handicap, uma linha por linha de handicap, com
      o valor repetido: o que muda entre as linhas é quais premissas se aplicam (favorito ou
      azarão). No Ambos marcam e na Dupla chance, sem linha, como o 1X2. Na Dupla chance, os
      insumos x_* valem 1.0/0.0: são o veredito de premissas do 1X2 que ela reusa.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                # Draw nunca chega (nenhuma premissa do 1X2 se aplica a ele), mas é saída
                # legítima do mercado, e a lista declara o conjunto, não a ocorrência. A "12"
                # da Dupla chance fica FORA: ela não tem modelo de premissa nenhum.
                values: ['Home', 'Draw', 'Away', 'Yes', 'No', '1X', 'X2']
      - name: market
        description: "Slug de futebol_mercados_pontuados() — 'match_winner' (1X2), 'asian_handicap' (AE#202), 'btts' (AE#208) ou 'double_chance' (AE#209), não um literal '1X2'/'AH'/'BTTS'/'DC'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['match_winner', 'asian_handicap', 'btts', 'double_chance']
      - name: line_value
        description: "NULL nos mercados sem linha (1X2, Ambos marcam, Dupla chance). No Handicap (AE#202), o handicap na ótica do MANDANTE — o mesmo line_value do funil e do board, igual para Home e Away."
      - name: premissa
        description: "Slug do catálogo futebol_insumos_premissa() — mesmo nome do modelo de premissas do mercado (int_futebol_premissas_1x2 / _ah / _btts / _dc) e de fact_value_opportunities.evidencias."
        tests: [not_null]
      - name: insumo
        description: "Nome do insumo, literalmente o mesmo de Insumo declarado/Regime do insumo (CONTEXT.md) — a chave que cruza esta linha com o regime declarado no catálogo."
        tests: [not_null]
      - name: valor
        description: "O número que a premissa comparou. Pode ser NULL — insumo existia e não tinha dado, não que o insumo não exista (Insumo medido, CONTEXT.md). Na Dupla chance (AE#209), os insumos x_* são o VEREDITO de uma premissa do 1X2 que a DC reusa e valem 1.0/0.0 (declarados em `booleanos` no catálogo); o número por trás deles está na linha match_winner do mesmo jogo, no lado coberto (Home para 1X, Away para X2)."
    tests:
      # Grão completo — os SEIS campos que a ADR 0016 declara como o grão congelado. Desde a
      # AE#202 market/line_value variam de verdade: o Handicap repete (fixture, outcome,
      # premissa, insumo) em várias linhas de handicap, e sem eles na combinação a chave
      # acusaria duplicata onde não há — ou, com line_value errado, deixaria passar duas
      # linhas de handicap caindo na mesma chave.
      #
      # tag:guarda desde a AE#202: a tabela entrou no `--select` dos dois workflows que
      # reconstroem os pais (DE#85, 16/09), a condição que a AE#175 deixou para ligar a tag.
      # Com o Handicap, esta é a guarda que pega line_value errado (duas linhas de handicap
      # caindo na mesma chave).
      - dbt_utils.unique_combination_of_columns:
          config:
            tags: ['guarda']
          arguments:
            combination_of_columns:
              - fixture_id
              - outcome
              - market
              - line_value
              - premissa
              - insumo
