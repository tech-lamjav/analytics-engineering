version: 2

models:
  - name: fact_value_opportunities
    description: >
      Mart de saída do Motor de Score de Confiabilidade (value bet futebol). 1 linha por
      (fixture_id, market, outcome, line_value) que passa no gate (edge>0 E n_casas>=3 E de-vig
      válido E conjunto da Pinnacle completo pro mercado E score>=40 E — p/ asian_handicap e
      goals_over_under — linha meia .5, sem push). Score 0-100 = clamp(PTS_VALOR + PTS_PREMISSAS
      + PTS_CORROBORACAO − PENALIDADES) — índice de CONFIABILIDADE, não de EV (ranqueie por
      `edge`); faixa Alta(>=60)/Média(40-59). Long por
      `market` — v5: 1X2 (match_winner) + Gols O/U (goals_over_under) + Handicap asiático
      (asian_handicap) + Ambos Marcam/BTTS (btts, via de-vig de consenso) + Dupla Chance
      (double_chance, saídas 1X/X2, prob derivada do 1X2 da Pinnacle, gate próprio). valor_fonte distingue.
      ⚠️ Desde a #40 o gate é avaliado em TODAS as janelas coletadas e só depois reduzido a uma
      linha: é o que permite dizer, em `janela_deteccao`, há quanto tempo a oportunidade está no
      board. O grão não muda; o custo por build sim (os joins abrem ~4x antes do filtro final).
      ⚠️ EXPURGO (#85, ADR 0009): passar no gate deixou de bastar. O mart é a JANELA DO QUE AINDA
      DÁ PARA APOSTAR — junta `fact_fixtures` e não emite linha de jogo com status terminal
      (FT/AET/PEN/CANC/ABD/AWD/WO) nem ao vivo, com rede de segurança em kickoff +
      `var expurgo_carencia_horas` (24) para o jogo que passou do apito e nunca recebeu status.
      `PST`, `SUSP` e `INT` SOBREVIVEM, inclusive além da carência: kickoff no passado com jogo
      por acontecer é oportunidade legítima. Antes disso o mart não tinha filtro de data nem de
      status e reemitia jogo encerrado a cada run — 133 linhas no PRD em 20/08, só 6 de jogo
      futuro, a mais velha de 19/06. NENHUMA COLUNA NOVA saiu daqui por causa disso (coluna nova
      em tabela sincronizada exigiria migration no Postgres antes do deploy da imagem; o filtro
      por join não exige nada). Nada é apagado: o `fact_value_opportunities_hist` fecha e guarda
      a versão, e é dele que o app serve o passado em leitura point-in-time no apito. O predicado
      mora em `macros/futebol_expurgo.sql`, num lugar só, porque a guarda
      `assert_board_sem_jogo_encerrado` o espelha.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: market
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['match_winner', 'goals_over_under', 'asian_handicap', 'btts', 'double_chance']
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Draw', 'Away', 'Over', 'Under', 'Yes', 'No', '1X', 'X2']
      - name: line_value
        description: "NULL no 1X2, BTTS e Dupla Chance; a linha L (1.5/2.5/3.5/...) no Gols O/U; o handicap (ótica do mandante, mesmo p/ Home e Away) no Handicap asiático."
      - name: is_half_line
        description: "TRUE só se a linha é meia (.5, a única sem push nem meio-push); FALSE p/ linha cheia (x.0) e p/ os DOIS quartos (.25 e .75, que dão meio-push); NULL onde não há linha (1X2/BTTS/DC). O gate só materializa asian_handicap/goals_over_under quando is_half_line (#2 — evita edge superdimensionado por push ignorado). Predicado em `futebol_e_linha_meia()`; até a #101 a linha de quarto .25 saía TRUE aqui."
      - name: valor_fonte
        description: "Fonte do de-vig/edge: 'pinnacle' (mercados 1/4/5 da Pinnacle; e Dupla Chance, derivada do 1X2 da Pinnacle) ou 'consenso' (mediana das casas — BTTS, pois a Pinnacle não precifica; rotular como estimativa no front; exige edge>=consensus_min_edge no gate). #1"
        tests:
          - accepted_values:
              arguments:
                values: ['pinnacle', 'consenso']
      - name: score
        description: >
          Índice de CONFIABILIDADE 0-100 = clamp(PTS_VALOR(≤30) + PTS_PREMISSAS + PTS_CORROBORACAO
          − PENALIDADES). NÃO é ranking de EV: pts_valor (o componente de edge) é minoria do total,
          então score maior ≠ edge maior. O gate exige score>=40 ("abaixo de 40 não vira
          oportunidade"). Para ordenar por tamanho de vantagem, use `edge`.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: faixa
        description: "Faixa de CONFIABILIDADE derivada do score: 'Alta' (>=60) | 'Média' (40-59). 'Baixa' (<40) NÃO é materializada — o gate score>=40 já a exclui ('abaixo de 40 não vira oportunidade'); o accepted_values sem 'Baixa' vira sentinela do gate."
        tests:
          - accepted_values:
              arguments:
                values: ['Alta', 'Média']
      - name: premissas_sem_dado
        description: >
          Quantas premissas do mercado se aplicavam a esta linha, não acenderam, e não
          acenderam por FALTA DE INSUMO (#41, ADR 0003). NÃO entra na conta do score: é o que
          o score não pôde levar em conta, e o aviso correspondente sai em `avisos` sem
          pontos entre parênteses, porque não desconta nada. Premissa do outro lado da linha
          (Under numa linha de Over, azarão numa de favorito) não conta — ela não está cega,
          está fora de jogo. Contador maior = nota mais incompleta, não nota contrária; é por
          ele que a base de medição pode ser filtrada por completude. ⚠️ Ampliar o horizonte
          do board o aumenta POR CONSTRUÇÃO: o board mais cedo é o board que sabe menos.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: janela_usada
        description: >
          Janela de coleta da avaliação PUBLICADA — a mais recente disponível para a linha
          (daily < t24h < t1h < t15m). É a janela de onde saem best_odd, edge e as penalidades
          de preço: o que o board mostra é o preço que ainda dá para pegar.
        tests: [not_null]
      - name: janela_deteccao
        description: >
          Janela mais cedo em que ESTA linha passou no gate (#40, ADR 0004) — o "há quanto tempo
          está no board", para o apostador julgar se o mercado já teve chance de corrigir a
          oportunidade. Igual a `janela_usada` quando a linha nasceu na janela corrente; mais
          cedo quando ela já vinha passando. NUNCA posterior a `janela_usada` — guarda
          assert_janela_deteccao_nao_posterior. ⚠️ Não é "quando o alerta saiu": linha que passou
          em t24h e não passa mais na janela corrente sai do board inteira (preço que não dá mais
          para pegar não é oportunidade); o registro do que já foi anunciado vive no snapshot
          fact_value_opportunities_hist.
        tests:
          # Sem tag de propósito, e sem buraco no agendado: o caso NULL desta coluna é a
          # primeira das duas condições de assert_janela_deteccao_nao_posterior, que é
          # `tag:guarda`. Aqui o not_null serve o `dbt build` local e o CI.
          - not_null
          # Mesma lista, mesmo motivo e MESMA TAG do accepted_values de
          # int_futebol_odds_devig.janela_usada: a ordem das janelas vive no macro
          # futebol_janela_prioridade e janela fora da lista cai no ELSE 0 dele. Aqui a guarda
          # também REPORTA em vez de prevenir — no agendado o `dbt run` é a fase 2 e o
          # `dbt test --select tag:guarda` a 4, sem gate. Sem a tag ela não rodaria em lugar
          # nenhum (o agendado só executa `tag:guarda`) e o comentário acima descreveria um
          # caminho que o teste não teria como percorrer.
          - accepted_values:
              arguments:
                values: ['daily', 't24h', 't1h', 't15m']
              config:
                severity: error
                tags: ['guarda']
      # AS QUATRO PARCELAS DE penalidades_globais_pts (#87). Sem teste de coluna aqui: a
      # afirmação que importa não é sobre cada uma isolada, é a identidade entre as quatro e
      # o agregado — e ela vive em assert_penalidades_globais_decompostas (tag:guarda), que é
      # onde o agendado a lê. Um not_null por coluna seria mais fraco (o braço do NULL da
      # guarda já cobre) e diria menos.
      - name: pen_odd_outlier
        description: >
          TRUE quando a melhor odd está >= 10% acima da média das OUTRAS casas — provável linha
          mole ou erro de precificação (−30 pts). Vale para a janela PUBLICADA (`janela_usada`)
          e para o mercado desta linha. É uma das quatro parcelas de `penalidades_globais_pts`,
          e é a mesma flag que emite o aviso correspondente em `avisos[]`.
      - name: pen_poucas_casas
        description: >
          TRUE quando menos de 4 casas cobrem o mercado (−12 pts) — mercado fino, preço menos
          confiável. Não confundir com o gate `n_casas >= 3`, que é eliminatório: aqui a linha
          entrou no board e leva desconto. Parcela de `penalidades_globais_pts`.
      - name: pen_odd_longshot
        description: >
          TRUE quando a melhor odd passa de 4,5 (−15 pts) — azarão, onde o de-vig erra mais e a
          variância manda mais que o edge. Parcela de `penalidades_globais_pts`.
      - name: pen_odd_juice
        description: >
          TRUE quando a melhor odd é menor que 1,40 (−10 pts) — retorno baixo demais para o
          risco. Parcela de `penalidades_globais_pts`. ⚠️ Sempre FALSE na Dupla Chance, e de
          propósito: aquele ramo tem gate de odd próprio (melhor_odd >= 1,25) e não aplica a
          penalidade de juice, então a soma dele também não tem o termo de 10 pontos.
      - name: edge
        description: "EV/edge = best_odd * prob_justa − 1. Gate garante > 0 nas linhas materializadas. É a MEDIDA DE VALOR/EV — ranqueie por `edge` p/ tamanho de vantagem; `score`/`faixa` são índice de CONFIABILIDADE (não monotônicos no edge)."
    tests:
      # O GRÃO NÃO MUDOU com a #40 — a janela NÃO entra nele. Depois que o gate passou a ser
      # avaliado por (linha × janela), esta guarda é o que prova que a redução final continua
      # devolvendo uma linha só: sem ela, a mesma oportunidade sairia no board uma vez por
      # janela e o front não teria como saber qual mostrar.
      #
      # `tag:guarda` acrescentada na #40, e não é enfeite: até aqui a unicidade era garantida
      # pelo QUALIFY do macro, ANTES dos joins, e este teste era confirmação de algo que a
      # forma da consulta já impunha. Agora ela depende do `WHERE janela_e_corrente` do próprio
      # mart — passou a ser a única coisa que separa o board de uma linha por janela, e uma
      # guarda dessas que não roda no agendado é uma guarda que ninguém lê.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - market
              - outcome
              - line_value
          config:
            tags: ['guarda']
