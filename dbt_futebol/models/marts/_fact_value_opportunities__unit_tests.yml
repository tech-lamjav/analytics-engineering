version: 2

# ==============================================================================
# Unit test da JANELA DE DETECÇÃO (#40, ADR 0004).
#
# Por que unit test e não data test: as três situações que a coluna existe para
# distinguir — detectada cedo e ainda viva, detectada cedo e já morta, nascida na
# janela corrente — são indistinguíveis numa contagem sobre produção. Um board em
# que toda `janela_deteccao` é igual a `janela_usada` é compatível tanto com "a
# coluna está certa e nenhuma oportunidade sobreviveu duas janelas" quanto com "a
# coluna está copiando janela_usada". Só linha construída separa as duas.
#
# Cada fixture isola um caso e muda UMA COISA SÓ em relação ao caso base:
#
#   1  passou em t24h e segue passando em t15m -> publica com deteccao=t24h
#   2  passou em t24h e NÃO passa em t15m (o edge virou negativo) -> fora do board
#   3  falhou em t24h (poucas casas) e só passou em t15m -> deteccao=t15m
#   4  passou em t24h e a t15m veio com o conjunto da Pinnacle INCOMPLETO
#      (pin_n_outcomes=2) -> fora do board
#
# A fixture 4 é a que não é óbvia, e é a razão de `janela_e_corrente` ser carimbado
# no macro sobre o de-vig CRU em vez de calculado dentro do mart. A t15m dela é
# descartada pelo filtro de completude do ramo 1X2; se o "qual é a janela corrente"
# fosse tirado DEPOIS desse filtro, a t24h passaria a ser a corrente e a linha
# continuaria no board exibindo o preço de ontem. Com o flag vindo de cima, ela
# simplesmente não tem janela corrente publicável — que é o que a ADR 0004 decidiu.
#
# As linhas do de-vig são deliberadamente idênticas fora do que cada caso move:
# pts_valor 30 + pts_premissas 15 = score 45 (faixa Média), a folga mínima confortável
# sobre o gate de 40. Se alguém mexer nesses pesos e o teste ficar vermelho por score,
# é o número daqui que se ajusta — não é o caso de teste que está errado.
# ==============================================================================
unit_tests:
  - name: value_opportunities_janela_deteccao_e_a_mais_cedo_que_passou
    model: fact_value_opportunities
    description: >
      A janela de detecção é a janela mais cedo em que a linha passou no gate, e nunca
      é posterior à janela avaliada. Linha que passou cedo e não passa na janela
      corrente — por preço ou por conjunto incompleto — não aparece no board.
    given:
      # format: sql porque evidencias/avisos são ARRAY<STRING>, e o formato de
      # dicionário entrega todo valor como escalar (o cast de STRING p/ ARRAY falha).
      - input: ref('int_futebol_premissas_1x2')
        format: sql
        rows: |
          SELECT 1 AS fixture_id, 'Home' AS outcome, 'brasileirao' AS competition,
                 2026 AS season, 15 AS pts_premissas, 0 AS premissas_sem_dado,
                 0 AS penalidades_1x2_pts,
                 CAST([] AS ARRAY<STRING>) AS evidencias,
                 CAST([] AS ARRAY<STRING>) AS avisos
          UNION ALL SELECT 2, 'Home', 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 3, 'Home', 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 4, 'Home', 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)

      - input: ref('int_futebol_odds_devig')
        rows:
          # -- fixture 1: passou nas duas. A t15m é a corrente; a t24h é a detecção. ---
          - {fixture_id: 1, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't24h', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 1, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.08, pts_valor: 30, best_odd: 2.15, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

          # -- fixture 2: o mercado corrigiu até o fechamento — edge virou negativo. ---
          - {fixture_id: 2, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't24h', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 2, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: -0.05, pts_valor: 30, best_odd: 1.90, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

          # -- fixture 3: em t24h o mercado ainda não estava líquido (2 casas). --------
          - {fixture_id: 3, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't24h', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 2, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 3, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

          # -- fixture 4: a t15m existe, mas com o conjunto 1X2 da Pinnacle incompleto.
          # O ramo 1X2 a descarta (pin_n_outcomes >= 3). A t24h NÃO herda o posto de
          # janela corrente por isso — é a asserção que protege o carimbo no macro.
          - {fixture_id: 4, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't24h', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 4, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 2, n_outcomes_valor: 2, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

      # Os outros quatro mercados e a corroboração ficam vazios de propósito: o que se
      # mede aqui é só a janela, e o 1X2 é o ramo com o gate de completude mais estrito.
      - input: ref('int_futebol_premissas_ou')
        rows: []
      - input: ref('int_futebol_premissas_ah')
        rows: []
      - input: ref('int_futebol_premissas_btts')
        rows: []
      - input: ref('int_futebol_premissas_dc')
        rows: []
      - input: ref('int_futebol_corroboracao')
        rows: []

      # #85: o mart ganhou um ref novo (`fact_fixtures`, para o expurgo) e todo ref
      # precisa de mock — sem este bloco o unit test não roda. Os quatro jogos entram
      # como futuros e 'NS' de propósito: aqui se mede a JANELA DE DETECÇÃO, e nenhuma
      # linha pode morrer pela fronteira do board sem que a asserção acima mude de
      # significado em silêncio. A fronteira tem teste próprio, logo abaixo.
      - input: ref('fact_fixtures')
        format: sql
        rows: |
          SELECT 1 AS fixture_id, 'NS' AS status_short,
                 TIMESTAMP '2099-01-01 00:00:00+00' AS kickoff_utc
          UNION ALL SELECT 2, 'NS', TIMESTAMP '2099-01-01 00:00:00+00'
          UNION ALL SELECT 3, 'NS', TIMESTAMP '2099-01-01 00:00:00+00'
          UNION ALL SELECT 4, 'NS', TIMESTAMP '2099-01-01 00:00:00+00'

    expect:
      rows:
        # fixture 1: publica a t15m (o preço que dá para pegar) e conta que a
        # oportunidade está no board desde a t24h.
        - {fixture_id: 1, market: 'match_winner', outcome: 'Home', janela_usada: 't15m', janela_deteccao: 't24h', score: 45, penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
        # fixture 3: nasceu na janela corrente — detecção e avaliação coincidem.
        - {fixture_id: 3, market: 'match_winner', outcome: 'Home', janela_usada: 't15m', janela_deteccao: 't15m', score: 45, penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
        # As fixtures 2 e 4 não aparecem. São as duas formas de morrer na janela
        # corrente: a 2 por preço, a 4 por conjunto incompleto.

  - name: value_opportunities_expurgo_a_fronteira_do_board
    model: fact_value_opportunities
    description: >
      A fronteira do expurgo (#85, ADR 0009) é o STATUS, não o relógio. Cobre as cinco
      formas de sair ou ficar, e a que mais importa é a terceira: PST/SUSP/INT sobrevivem
      INCLUSIVE além da carência — sem essa exceção a rede de 24 h expurgaria exatamente
      a linha que a decisão manda preservar.
    given:
      # Seis jogos idênticos em tudo que não seja a fronteira: mesmos pontos, mesmo
      # preço, uma janela só. O que os separa é só o par (status, kickoff), então
      # qualquer diferença no resultado é atribuível ao expurgo e a mais nada.
      - input: ref('int_futebol_premissas_1x2')
        format: sql
        rows: |
          SELECT 10 AS fixture_id, 'Home' AS outcome, 'brasileirao' AS competition,
                 2026 AS season, 15 AS pts_premissas, 0 AS premissas_sem_dado,
                 0 AS penalidades_1x2_pts,
                 CAST([] AS ARRAY<STRING>) AS evidencias,
                 CAST([] AS ARRAY<STRING>) AS avisos
          UNION ALL SELECT 11, 'Home', 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 12, 'Home', 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 13, 'Home', 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 14, 'Home', 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 15, 'Home', 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 16, 'Home', 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)

      - input: ref('int_futebol_odds_devig')
        rows:
          - {fixture_id: 10, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 11, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 12, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 13, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 14, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 15, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 16, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

      # A FIXTURE 15 NÃO ESTÁ AQUI, e é de propósito: é o fail-open do LEFT JOIN
      # (ADR 0003). Fixture ausente não expurga a linha — quem grita nesse caso é a
      # guarda 1, com diagnóstico próprio, e não o sumiço silencioso da oportunidade.
      - input: ref('fact_fixtures')
        format: sql
        rows: |
          -- 10: jogo futuro, não começou. FICA.
          SELECT 10 AS fixture_id, 'NS' AS status_short,
                 TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL 6 HOUR) AS kickoff_utc
          -- 11: terminou. SAI por status terminal.
          UNION ALL SELECT 11, 'FT', TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 3 HOUR)
          -- 12: bola rolando. SAI — não se aposta pré-jogo com o jogo em curso.
          UNION ALL SELECT 12, '1H', TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 1 HOUR)
          -- 13: ADIADO há 10 dias. FICA, apesar de o kickoff ter passado MUITO da
          --     carência de 24 h. É a asserção central deste teste.
          UNION ALL SELECT 13, 'PST', TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 240 HOUR)
          -- 14: passou do apito há 48 h e nunca recebeu status final. SAI pela rede de
          --     segurança — é o sintoma de coleta de placar falha (task [C]).
          UNION ALL SELECT 14, 'NS', TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 48 HOUR)
          -- 16: o fixture EXISTE mas o status é NULL, e o apito foi há 48 h. SAI.
          --     Sem o COALESCE no braço do relógio, `NULL NOT IN (...)` devolveria NULL, o
          --     predicado inteiro viraria NULL e a linha ficaria no board PARA SEMPRE — e a
          --     guarda 1, que espelha o predicado, também não acenderia. É o caso literal
          --     que a rede de segurança existe para cobrir, e ele escapava por NULL.
          UNION ALL SELECT 16, CAST(NULL AS STRING),
                 TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 48 HOUR)

      - input: ref('int_futebol_premissas_ou')
        rows: []
      - input: ref('int_futebol_premissas_ah')
        rows: []
      - input: ref('int_futebol_premissas_btts')
        rows: []
      - input: ref('int_futebol_premissas_dc')
        rows: []
      - input: ref('int_futebol_corroboracao')
        rows: []

    expect:
      rows:
        # 10 — jogo por acontecer.
        - {fixture_id: 10, market: 'match_winner', outcome: 'Home', score: 45}
        # 13 — adiado há 10 dias: sobrevive INCLUSIVE além da carência.
        - {fixture_id: 13, market: 'match_winner', outcome: 'Home', score: 45}
        # 15 — sem fixture: o fail-open deixa passar (ADR 0003), a guarda 1 acusa.
        - {fixture_id: 15, market: 'match_winner', outcome: 'Home', score: 45}
        # Não aparecem: 11 (terminal), 12 (ao vivo), 14 (carência) e 16 (status NULL
        # além da carência — o caso que escapava por NULL antes do COALESCE).
        #
        # A 15 e a 16 são o par que dá o desenho: as duas têm informação faltando, e
        # elas vão para lados OPOSTOS de propósito. Na 15 falta o jogo inteiro — é
        # defeito a montante, a linha fica e a guarda grita. Na 16 falta só o carimbo
        # do fim — é a ausência de placar que a carência existe para cobrir, e a linha
        # sai. "Não sei que jogo é este" e "sei qual é e ninguém carimbou o fim" não
        # podem ter o mesmo destino.

  # ---------------------------------------------------------------------------
  # A PORTA DA LINHA MEIA, NO BOARD (#101).
  #
  # O gêmeo deste caso vive no funil (`funil_linha_meia_e_por_quarto_de_linha`), e
  # até aqui era o ÚNICO: os dois unit tests do board são 100% 1X2, com `line_value`
  # vazio em toda linha mockada, então o modelo que serve o usuário não tinha
  # nenhuma linha construída exercitando esta porta.
  #
  # Hoje os dois marts não têm como divergir — chamam o mesmo
  # `futebol_e_linha_meia()` —, e `assert_funil_paridade_com_board` pegaria a
  # divergência nas linhas publicadas. Mas a paridade é declaradamente temporária: o
  # plano é o board passar a LER do funil, e nesse dia a guarda se aposenta e o funil
  # deixa de ser um segundo cálculo. Este teste é o que sobra quando isso acontecer.
  #
  # E a asserção aqui é diferente da do funil, de propósito. O funil grava o veredito
  # de cada porta e responde "por que reprovou"; o board só responde "aparece ou
  # não". A linha de quarto SUMIR do board é a consequência que o usuário vê, e é ela
  # que precisa estar presa.
  # ---------------------------------------------------------------------------
  - name: value_opportunities_linha_de_quarto_nao_chega_ao_board
    model: fact_value_opportunities
    description: >
      Três candidatos de Gols O/U idênticos fora da linha — cheia (2.0), de quarto
      (2.25) e meia (2.5). Só a meia é publicada. Antes da #101 a de quarto entrava no
      board como se não pudesse dar push.
    given:
      - input: ref('int_futebol_premissas_ou')
        format: sql
        rows: |
          SELECT 20 AS fixture_id, 'Over' AS outcome, 2.0 AS line_value,
                 'brasileirao' AS competition, 2026 AS season,
                 15 AS pts_premissas, 0 AS premissas_sem_dado,
                 0 AS penalidades_ou_pts,
                 CAST([] AS ARRAY<STRING>) AS evidencias,
                 CAST([] AS ARRAY<STRING>) AS avisos
          UNION ALL SELECT 21, 'Over', 2.25, 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 22, 'Over', 2.5, 'brasileirao', 2026, 15, 0, 0,
                 CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)

      - input: ref('int_futebol_odds_devig')
        rows:
          - {fixture_id: 20, market_id: 5, outcome_side: 'Over', line_value: 2.0, janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 2, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 21, market_id: 5, outcome_side: 'Over', line_value: 2.25, janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 2, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 22, market_id: 5, outcome_side: 'Over', line_value: 2.5, janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 2, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

      - input: ref('int_futebol_premissas_1x2')
        rows: []
      - input: ref('int_futebol_premissas_ah')
        rows: []
      - input: ref('int_futebol_premissas_btts')
        rows: []
      - input: ref('int_futebol_premissas_dc')
        rows: []
      - input: ref('int_futebol_corroboracao')
