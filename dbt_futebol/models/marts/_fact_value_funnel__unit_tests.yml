  # ---------------------------------------------------------------------------
  # 6. A NOTA DE CONTEXTO NÃO TEM PREÇO DENTRO (#103, ADR 0012).
  #
  # É o teste que a guarda de reconstrução não alcança: ela prova que a coluna
  # gravada bate com a recomposição, mas as duas leem a MESMA aritmética — se o
  # preço entrasse na composição, entraria nos dois lados e as duas fechariam.
  # Só linha construída separa "a nota ignora o preço" de "a nota e a sua cópia
  # concordam sobre o preço".
  #
  # O par 1/2 é o coração: DOIS candidatos com o MESMO contexto (pts_premissas 20,
  # nenhuma penalidade de contexto) e preços opostos — um com 30 de valor, 15 de
  # corroboração e 30 de penalidade de odd; o outro com zero dos três. O `score`
  # deles difere em 15 pontos, e a `nota_contexto` tem de ser IDÊNTICA.
  # ---------------------------------------------------------------------------
  - name: funil_nota_de_contexto_ignora_o_preco
    model: fact_value_funnel
    overrides:
      macros:
        is_incremental: false
    description: >
      Cinco candidatos: o par preço-rico/preço-zero com o mesmo contexto, o empate do
      1X2 (que prova o piso em zero — 0 − 10 é 0, nunca −10), a "12" da Dupla Chance
      (sem premissa a avaliar: NULL, e não zero, pela ADR 0003) e uma linha de Gols
      com penalidade de contexto (12 − 10 = 2).
    given:
      - input: ref('int_futebol_odds_devig')
        rows:
          # -- 1: PREÇO RICO. Valor máximo, corroboração cheia e a penalidade de odd
          # mais cara do catálogo (outlier, −30). score = 30+20+15−30 = 35.
          - {fixture_id: 1, competition: 'brasileirao', season: 2026, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.40, pts_valor: 30, best_odd: 2.80, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 30, pen_odd_outlier: true, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

          # -- 2: PREÇO ZERO, mesmo contexto do 1. score = 0+20+0−0 = 20.
          - {fixture_id: 2, competition: 'brasileirao', season: 2026, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.00, pts_valor: 0, best_odd: 2.00, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

          # -- 3: O EMPATE. Nenhuma premissa dispara (0 pontos) e o `pick_empate` cobra
          # −10: o piso da nota de contexto é 0, nunca −10.
          - {fixture_id: 3, competition: 'brasileirao', season: 2026, market_id: 1, outcome_side: 'Draw', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 3.50, best_book: 'Bet365', avg_odd: 3.30, n_casas: 5, prob_justa_fechamento: 0.30, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

          # -- 4: A "12" da Dupla Chance. Não há premissa a avaliar -> `pts_premissas`
          # NULL -> nota de contexto NULL. Zero seria "foi avaliada e tirou zero".
          - {fixture_id: 4, competition: 'brasileirao', season: 2026, market_id: 12, outcome_side: '12', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 1.50, best_book: 'Bet365', avg_odd: 1.45, n_casas: 5, prob_justa_fechamento: 0.60, pin_n_outcomes: , n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

          # -- 5: Gols numa linha extrema. 12 de premissa − 10 de `linha_extrema` = 2.
          - {fixture_id: 5, competition: 'brasileirao', season: 2026, market_id: 5, outcome_side: 'Over', line_value: 0.5, janela_usada: 't15m', edge: 0.10, pts_valor: 30, best_odd: 1.20, best_book: 'Bet365', avg_odd: 1.18, n_casas: 5, prob_justa_fechamento: 0.85, pin_n_outcomes: 2, n_outcomes_valor: 2, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

      - input: ref('int_futebol_premissas_1x2')
        format: sql
        rows: |
          SELECT 1 AS fixture_id, 'Home' AS outcome, 20 AS pts_premissas,
                 0 AS premissas_sem_dado, 0 AS penalidades_1x2_pts
          UNION ALL SELECT 2, 'Home', 20, 0, 0
          -- o empate: zero de premissa e os −10 do `pick_empate`.
          UNION ALL SELECT 3, 'Draw', 0, 0, 10

      - input: ref('int_futebol_premissas_ou')
        format: sql
        rows: |
          SELECT 5 AS fixture_id, 'Over' AS outcome, 0.5 AS line_value,
                 12 AS pts_premissas, 0 AS premissas_sem_dado, 10 AS penalidades_ou_pts

      # A "12" (fixture 4) NÃO tem linha aqui, de propósito.
      - input: ref('int_futebol_premissas_dc')
        rows: []
      - input: ref('int_futebol_premissas_ah')
        rows: []
      - input: ref('int_futebol_premissas_btts')
        rows: []

      # Só o fixture 1 tem corroboração, e cheia (7 + 8 = 15). É metade do par: o
      # gêmeo dele (2) não tem nenhuma, e a nota de contexto dos dois é a mesma.
      - input: ref('int_futebol_corroboracao')
        format: sql
        rows: |
          SELECT 1 AS fixture_id, 1 AS market_id, 'Home' AS outcome_side,
                 CAST(NULL AS FLOAT64) AS line_value, 15 AS pts_corroboracao,
                 TRUE AS modelo_api_concorda, TRUE AS linha_sharp_confirma

      # o denominador congelado (#105/PPP#365) — ver o ⚠️ do cabeçalho sobre o fixture sintético.
      - input: ref('futebol_teto_nota_contexto')
        format: csv
        fixture: teto_nota_contexto_sintetico
      - input: ref('fact_fixtures')
        format: sql
        rows: |
          SELECT id AS fixture_id, TIMESTAMP '2099-01-01 00:00:00+00' AS kickoff_utc
          FROM UNNEST([1,2,3,4,5]) AS id

    expect:
      rows:
        - {fixture_id: 1, market: 'match_winner',     outcome: 'Home', score: 35, nota_contexto: 20}
        - {fixture_id: 2, market: 'match_winner',     outcome: 'Home', score: 20, nota_contexto: 20}
        - {fixture_id: 3, market: 'match_winner',     outcome: 'Draw', score: 20, nota_contexto: 0}
        - {fixture_id: 4, market: 'double_chance',    outcome: '12',   score: ,   nota_contexto: }
        - {fixture_id: 5, market: 'goals_over_under', outcome: 'Over', score: 32, nota_contexto: 2}

  # ---------------------------------------------------------------------------
  # 7. A ARITMÉTICA DA NOTA NORMALIZADA (#105, ADR 0005; teto do catálogo desde a
  #    PPP#365, ADR 0013).
  #
  # É o teste que nenhuma contagem sobre produção conseguiria fazer. Num funil real,
  # "a nota nunca passa de 100" é compatível tanto com o clamp funcionando quanto com
  # nenhuma linha ter chegado perto do teto; "a nota do empate é zero" é compatível
  # tanto com o zero explícito antes da divisão quanto com um `SAFE_DIVIDE` devolvendo
  # NULL que ninguém leu. Só linha construída separa as duas.
  #
  # Os cinco casos que o aceite da issue #105 pedia, mais três que a mesma aritmética
  # exige — a troca do denominador (PPP#365) não muda nenhum deles, é a MESMA divisão
  # com clamp, só o nome e a origem do número mudam:
  #   1  pontos IGUAIS ao teto             -> 100
  #   2  pontos na METADE do teto          -> 50
  #   3  pontos ACIMA do teto              -> 100, e não 137 (clamp explícito)
  #   4  arredondamento                    -> 25/40 = 62,5 -> 63, inteiro
  #   5  penalidade MAIOR que os pontos    -> 0, e não negativo
  #   6  teto = 0 com pontos = 0           -> 0, sem divisão por zero e sem NULL
  #   7  teto = 0 com pontos > 0           -> 0, e é o ramo do zero explícito sozinho
  #   8  sem premissa a avaliar            -> NULL, e não 0 (ADR 0003)
  #
  # O par 9/10 é o eixo do LADO, e é o que prova que a normalização não é por mercado:
  # dois candidatos do Handicap com os MESMOS 20 pontos e a mesma linha (−1.5), um pelo
  # Home e outro pelo Away. O Home dá o handicap (Favorito, teto 40 -> 50) e o Away o
  # recebe (Azarão, teto 20 -> 100). Sob um denominador por mercado os dois sairiam
  # iguais, e o teste ficaria verde com o eixo errado.
  #
  # ⚠️ O caso 3 usa um teto sintético (40) MENOR do que o real permitiria alcançar de
  # propósito, só para exercitar o ramo "pontos acima do denominador": com o denominador
  # DECLARADO (teto do catálogo) isso não deveria acontecer em produção — pontos nunca
  # excedem a soma dos pesos do lado —, mas o `LEAST` protege mesmo assim contra erro de
  # seed ou de catálogo desalinhados.
  #
  # ⚠️ O caso 7 é MOCK DELIBERADAMENTE IRREAL: em produção nenhuma premissa do Handicap
  # dispara com a linha 0 (todas são `is_favorito AND ...` ou `is_azarao AND ...`).
  # Ele existe para isolar o ramo do denominador zero do caso em que a nota já seria
  # zero de qualquer jeito — que é justamente o confundidor do caso 6.
  # ---------------------------------------------------------------------------
  - name: funil_nota_normalizada_pelo_teto_congelado
    model: fact_value_funnel
    overrides:
      macros:
        is_incremental: false
    description: >
      Dez candidatos que percorrem a aritmética inteira da `score_normalizado`: o teto,
      a metade, o clamp em 100, o arredondamento, o piso em zero, os dois ramos de
      denominador zero, a saída sem premissa a avaliar (NULL) e o par que prova que o
      eixo da normalização é o LADO e não o mercado.
    given:
      - input: ref('int_futebol_odds_devig')
        rows:
          # -- 1: pontos IGUAIS ao teto do lado (40) -> 100.
          - {fixture_id: 1, competition: 'brasileirao', season: 2026, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 0, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          # -- 2: METADE do teto -> 50.
          - {fixture_id: 2, competition: 'brasileirao', season: 2026, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 0, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          # -- 3: ACIMA do teto (55 de 40 = 137,5) -> 100. Ver o ⚠️ do caso 3 no
          # cabeçalho — sintético de propósito, exercita o clamp.
          - {fixture_id: 3, competition: 'brasileirao', season: 2026, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 0, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          # -- 4: 25 de 40 = 62,5 -> 63, INTEIRO. Se o CAST saísse de dentro do LEAST a
          # coluna viraria FLOAT64 e sairia 62.5.
          - {fixture_id: 4, competition: 'brasileirao', season: 2026, market_id: 1, outcome_side: 'Home', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 0, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          # -- 5: PENALIDADE MAIOR QUE OS PONTOS. Gols na linha extrema: 5 − 10 = −5, e o
          # piso da nota de contexto o leva a 0. A normalizada é 0, nunca −13.
          - {fixture_id: 5, competition: 'brasileirao', season: 2026, market_id: 5, outcome_side: 'Over', line_value: 0.5, janela_usada: 't15m', edge: 0.10, pts_valor: 0, best_odd: 1.20, best_book: 'Bet365', avg_odd: 1.18, n_casas: 5, prob_justa_fechamento: 0.85, pin_n_outcomes: 2, n_outcomes_valor: 2, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          # -- 6: DENOMINADOR ZERO com pontos zero — o empate do 1X2, que é o caso real.
          - {fixture_id: 6, competition: 'brasileirao', season: 2026, market_id: 1, outcome_side: 'Draw', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 0, best_odd: 3.50, best_book: 'Bet365', avg_odd: 3.30, n_casas: 5, prob_justa_fechamento: 0.30, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          # -- 7: DENOMINADOR ZERO com pontos > 0 — o empate do 1X2, com premissa
          # fabricada (na vida real o empate nunca tem premissa: nenhuma se aplica).
          # Isola o ramo do zero do caso 6, que tem pontos zero. ⚠️ B3 (#109): até
          # 2026-09-01 este caso usava o Pick do Handicap (linha 0) — deixou de servir
          # porque a B3 deu lado a ele (Favorito/Azarao pelo mando), e a macro não
          # produz mais 'Pick' para candidato nenhum.
          - {fixture_id: 7, competition: 'brasileirao', season: 2026, market_id: 1, outcome_side: 'Draw', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 0, best_odd: 3.50, best_book: 'Bet365', avg_odd: 3.30, n_casas: 5, prob_justa_fechamento: 0.30, pin_n_outcomes: 3, n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          # -- 8: A "12" da Dupla Chance. Sem premissa a avaliar -> nota de contexto NULL
          # -> normalizada NULL. Zero diria "foi avaliada e tirou zero" (ADR 0003).
          - {fixture_id: 8, competition: 'brasileirao', season: 2026, market_id: 12, outcome_side: '12', line_value: , janela_usada: 't15m', edge: 0.10, pts_valor: 0, best_odd: 1.50, best_book: 'Bet365', avg_odd: 1.45, n_casas: 5, prob_justa_fechamento: 0.60, pin_n_outcomes: , n_outcomes_valor: 3, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          # -- 9 e 10: O EIXO DO LADO. Mesmos 20 pontos, mesma linha (−1.5), lados
          # opostos: o Home dá o handicap (Favorito, teto 40) e o Away o recebe (Azarão,
          # teto 20). 50 contra 100.
          - {fixture_id: 9, competition: 'brasileirao', season: 2026, market_id: 4, outcome_side: 'Home', line_value: -1.5, janela_usada: 't15m', edge: 0.10, pts_valor: 0, best_odd: 2.10, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.48, pin_n_outcomes: 2, n_outcomes_valor: 2, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
          - {fixture_id: 10, competition: 'brasileirao', season: 2026, market_id: 4, outcome_side: 'Away', line_value: -1.5, janela_usada: 't15m', edge: 0.10, pts_valor: 0, best_odd: 1.80, best_book: 'Bet365', avg_odd: 1.75, n_casas: 5, prob_justa_fechamento: 0.55, pin_n_outcomes: 2, n_outcomes_valor: 2, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}

      - input: ref('int_futebol_premissas_1x2')
        format: sql
        rows: |
          SELECT 1 AS fixture_id, 'Home' AS outcome, 40 AS pts_premissas,
                 0 AS premissas_sem_dado, 0 AS penalidades_1x2_pts
          UNION ALL SELECT 2, 'Home', 20, 0, 0
          UNION ALL SELECT 3, 'Home', 55, 0, 0
          UNION ALL SELECT 4, 'Home', 25, 0, 0
          -- o empate: zero de premissa e os −10 do `pick_empate`.
          UNION ALL SELECT 6, 'Draw', 0, 0, 10
          -- fixture 7: empate FABRICADO com premissa (não acontece na vida real — isola
          -- o ramo do denominador zero com numerador > 0, ver comentário acima).
          UNION ALL SELECT 7, 'Draw', 20, 0, 0

      - input: ref('int_futebol_premissas_ou')
        format: sql
        rows: |
          SELECT 5 AS fixture_id, 'Over' AS outcome, 0.5 AS line_value,
                 5 AS pts_premissas, 0 AS premissas_sem_dado, 10 AS penalidades_ou_pts

      - input: ref('int_futebol_premissas_ah')
        format: sql
        rows: |
          SELECT 9 AS fixture_id, 'Home' AS outcome, -1.5 AS line_value,
                 20 AS pts_premissas, 0 AS premissas_sem_dado, 0 AS penalidades_ah_pts
          UNION ALL SELECT 10, 'Away', -1.5, 20, 0, 0

      # A "12" (fixture 8) NÃO tem linha aqui, de propósito: é o que a torna a saída
      # sem premissa a avaliar.
      - input: ref('int_futebol_premissas_dc')
        rows: []
      - input: ref('int_futebol_premissas_btts')
        rows: []
      - input: ref('int_futebol_corroboracao')
        rows: []

      - input: ref('futebol_teto_nota_contexto')
        format: csv
        fixture: teto_nota_contexto_sintetico

      - input: ref('fact_fixtures')
        rows: []

    expect:
      rows:
        - {fixture_id: 1,  lado: 'Home',     nota_contexto: 40, score_normalizado: 100}
        - {fixture_id: 2,  lado: 'Home',     nota_contexto: 20, score_normalizado: 50}
        - {fixture_id: 3,  lado: 'Home',     nota_contexto: 55, score_normalizado: 100}
        - {fixture_id: 4,  lado: 'Home',     nota_contexto: 25, score_normalizado: 63}
