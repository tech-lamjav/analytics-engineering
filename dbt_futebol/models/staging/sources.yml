version: 2

sources:
  - name: futebol
    description: "Dados brutos de futebol da API-Football v3 (external tables sobre GCS NDJSON)."
    database: smartbetting-dados
    schema: futebol
    tables:
      - name: raw_futebol_leagues
        description: >
          1 linha por (league_id, season) requisitada. Cobre Brasileirão (id=71)
          2024/2025/2026, Copa do Mundo (id=1) 2026, Série B (id=72) 2024/2025/2026,
          Copa do Brasil (id=73) 2024/2025/2026, CONMEBOL Libertadores (id=13)
          2024/2025/2026 e CONMEBOL Sudamericana (id=11) 2024/2025/2026. Arquivos:
          gs://smartbetting-landingzone/futebol/leagues/raw_futebol_leagues_current.json
          (ano corrente, diário) + raw_futebol_leagues_backfill.json (anos anteriores, one-shot).
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/create_futebol_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/leagues/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: requested_league_id
            description: "ID da liga requisitada (parâmetro `id` da chamada /leagues)"
          - name: requested_season
            description: "Ano da temporada requisitada (parâmetro `season` da chamada)"
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: league
            description: "STRUCT<id INT64, name STRING, type STRING, logo STRING>"
          - name: country
            description: "STRUCT<name STRING, code STRING, flag STRING>"
          - name: seasons
            description: "ARRAY<STRUCT<year INT64, start STRING, end STRING, current BOOL, coverage STRUCT<...>>>"

      - name: raw_futebol_teams
        description: >
          1 linha por (team, league_id, season) requisitada. Mesmo time pode aparecer em
          múltiplas (liga, temporada) — dedup acontece em dim_teams. Arquivos:
          gs://smartbetting-landingzone/futebol/teams/raw_futebol_teams_current.json
          (ano corrente, diário) + raw_futebol_teams_backfill.json (anos anteriores, one-shot).
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/teams/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: requested_league_id
            description: "ID da liga requisitada (parâmetro `league` da chamada /teams)"
          - name: requested_season
            description: "Ano da temporada requisitada"
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: team
            description: "STRUCT<id INT64, name STRING, code STRING, country STRING, founded INT64, national BOOL, logo STRING>"
          - name: venue
            description: "STRUCT<id INT64, name STRING, address STRING, city STRING, capacity INT64, surface STRING, image STRING>"

      - name: raw_futebol_players
        description: >
          1 linha por (player, league_id, season) requisitada. Mesmo jogador pode aparecer em
          múltiplas (liga, temporada) — dedup acontece em dim_players. Arquivos:
          gs://smartbetting-landingzone/futebol/players/raw_futebol_players_current.json
          (ano corrente, diário) + raw_futebol_players_backfill.json (anos anteriores, one-shot).
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/players/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: requested_league_id
            description: "ID da liga requisitada (parâmetro `league` da chamada /players)"
          - name: requested_season
            description: "Ano da temporada requisitada"
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: player
            description: "STRUCT<id INT64, name STRING, firstname STRING, lastname STRING, age INT64, birth STRUCT<date STRING, place STRING, country STRING>, nationality STRING, height STRING, weight STRING, injured BOOL, photo STRING>"
          - name: statistics
            description: "ARRAY<STRUCT<team, league, games STRUCT<position STRING, ...>, ...>>. position do jogador vem daqui (statistics[0].games.position)."

      - name: raw_futebol_fixtures
        description: >
          Tabela mãe — 1 linha por fixture (jogo) requisitada. Cobre Brasileirão (id=71)
          2024/2025/2026, Copa do Mundo (id=1) 2026, Série B (id=72) 2024/2025/2026,
          Copa do Brasil (id=73) 2024/2025/2026, CONMEBOL Libertadores (id=13)
          2024/2025/2026 e CONMEBOL Sudamericana (id=11) 2024/2025/2026. fixture_id destrava os endpoints
          de jogo (stats/events/lineups/player_stats — subtasks 5-8). Arquivos:
          gs://smartbetting-landingzone/futebol/fixtures/raw_futebol_fixtures_current.json
          (ano corrente, diário) + raw_futebol_fixtures_backfill.json (anos anteriores, one-shot).
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/fixtures/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: requested_league_id
            description: "ID da liga requisitada (parâmetro `league` da chamada /fixtures)"
          - name: requested_season
            description: "Ano da temporada requisitada"
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: fixture
            description: "STRUCT<id INT64, referee STRING, timezone STRING, date STRING, timestamp INT64, periods STRUCT<first INT64, second INT64>, venue STRUCT<id INT64, name STRING, city STRING>, status STRUCT<long STRING, short STRING, elapsed INT64>>"
          - name: league
            description: "STRUCT<id INT64, name STRING, country STRING, logo STRING, flag STRING, season INT64, round STRING>"
          - name: teams
            description: "STRUCT<home STRUCT<id INT64, name STRING, logo STRING, winner BOOL>, away STRUCT<id INT64, name STRING, logo STRING, winner BOOL>>. winner é NULL p/ jogos não finalizados."
          - name: goals
            description: "STRUCT<home INT64, away INT64>. Placar final do tempo normal; NULL antes do jogo."
          - name: score
            description: "STRUCT<halftime STRUCT<home INT64, away INT64>, fulltime STRUCT<home INT64, away INT64>, extratime STRUCT<home INT64, away INT64>, penalty STRUCT<home INT64, away INT64>>"

      - name: raw_futebol_fixture_statistics
        description: >
          Estatística agregada por time por jogo (/fixtures/statistics). 2 linhas por
          fixture (mandante e visitante), 1 arquivo por fixture_id. Só jogos finalizados
          (FT/AET/PEN). statistics fica como array aninhado [{type, value}] (value
          stringificado) — o pivot pra colunas tipadas acontece em
          stg_futebol_fixture_statistics. Arquivos:
          gs://smartbetting-landingzone/futebol/fixture_statistics/raw_futebol_fixture_statistics_{fixture_id}.json.
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/fixture_statistics/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: fixture_id
            description: "ID do jogo na API-Football (FK p/ fact_fixtures). 2 linhas por fixture."
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: total_teams
            description: "Metadata: nº de blocos de time no jogo (sempre 2). Ignorado downstream."
          - name: team
            description: "STRUCT<id INT64, name STRING, logo STRING>. id é o team_id do bloco."
          - name: statistics
            description: "ARRAY<STRUCT<type STRING, value STRING>>. value stringificado (int, '55%' ou null). Pivot por type em stg."

      - name: raw_futebol_fixture_events
        description: >
          Linha do tempo por jogo (/fixtures/events). N linhas por fixture (1 por
          evento: gol/cartão/substituição/VAR), 1 arquivo por fixture_id. Só jogos
          finalizados (FT/AET/PEN). A API não traz id nem campo de ordem nos eventos —
          event_order carimba o índice no array (ordem cronológica). team/player/assist
          ficam aninhados — o flatten acontece em stg_futebol_fixture_events. Arquivos:
          gs://smartbetting-landingzone/futebol/fixture_events/raw_futebol_fixture_events_{fixture_id}.json.
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/fixture_events/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: fixture_id
            description: "ID do jogo na API-Football (FK p/ fact_fixtures). N linhas por fixture."
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: event_order
            description: "Índice do evento no array da API (0-based) — preserva a ordem cronológica."
          - name: total_events
            description: "Metadata: nº de eventos do jogo. Ignorado downstream."
          - name: elapsed
            description: "Minuto do jogo em que o evento ocorreu (time.elapsed)."
          - name: extra
            description: "Minutos de acréscimo (time.extra). NULL fora dos acréscimos."
          - name: team
            description: "STRUCT<id INT64, name STRING, logo STRING>. Time do evento."
          - name: player
            description: "STRUCT<id INT64, name STRING>. Jogador principal do evento (autor do gol/cartão/quem entra na subst)."
          - name: assist
            description: "STRUCT<id INT64, name STRING>. Assistência do gol / quem sai na substituição. Frequentemente NULL."
          - name: type
            description: "Tipo do evento: 'Goal' | 'Card' | 'subst' | 'Var'."
          - name: detail
            description: "Detalhe do tipo (ex: 'Normal Goal', 'Yellow Card', 'Substitution 1', 'Penalty')."
          - name: comments
            description: "Comentário livre da API. Frequentemente NULL."

      - name: raw_futebol_fixture_lineups
        description: >
          Escalações por time por jogo (/fixtures/lineups). 2 linhas por (fixture, fase)
          (mandante e visitante), 1 arquivo por (fixture_id, fase). Wildcard cobre
          _confirmed (escalação ~T-30min) + _real (pós-jogo). team/coach + startXI/
          substitutes ficam aninhados — o flatten/UNNEST acontece em
          stg_futebol_fixture_lineups(_players). lineup_phase distingue a fase e faz parte
          do grão dos dois fatos (#38): as duas fases coexistem, e o latest-wins (dedup por
          loaded_at) acontece DENTRO de cada uma. Arquivos:
          gs://smartbetting-landingzone/futebol/fixture_lineups/raw_futebol_fixture_lineups_{fixture_id}_{confirmed|real}.json.
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/fixture_lineups/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: fixture_id
            description: "ID do jogo na API-Football (FK p/ fact_fixtures). 2 linhas por (fixture, fase)."
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: lineup_phase
            description: "'confirmed' (escalação ~T-30min) | 'real' (pós-jogo). Parte do grão dos dois fatos (#38); latest-wins por loaded_at dentro de cada fase."
          - name: total_teams
            description: "Metadata: nº de blocos de time no jogo (sempre 2). Ignorado downstream."
          - name: formation
            description: "Formação tática do time (ex: '4-2-3-1')."
          - name: team
            description: "STRUCT<id INT64, name STRING, logo STRING>. id é o team_id do bloco."
          - name: coach
            description: "STRUCT<id INT64, name STRING, photo STRING>. Técnico do time."
          - name: startXI
            description: "ARRAY<STRUCT<player STRUCT<id INT64, name STRING, number INT64, pos STRING, grid STRING>>>. 11 titulares; UNNEST em stg_..._players (is_starter=TRUE)."
          - name: substitutes
            description: "ARRAY<STRUCT<player STRUCT<id INT64, name STRING, number INT64, pos STRING, grid STRING>>>. Banco; UNNEST em stg_..._players (is_starter=FALSE). grid quase sempre NULL."

      - name: raw_futebol_fixture_player_stats
        description: >
          Estatística por jogador por jogo (/fixtures/players). N linhas por fixture
          (1 por jogador que entrou em campo, ambos os times; ~22-30/jogo), 1 arquivo
          por fixture_id. Só jogos finalizados (FT/AET/PEN). team/player + statistics
          ficam aninhados (statistics é STRUCT único, statistics[0] da API) — o flatten
          acontece em stg_futebol_fixture_player_stats. Schema explícito (não autodetect):
          muitos campos aninhados vêm null e games.rating + passes.accuracy são STRING.
          ⚠️ penalty.commited tem a grafia ERRADA da própria API (1 "t"); fouls.committed
          vem certo (2 "t"). Diferente de /fixtures/statistics, statistics NÃO é {type, value}.
          Arquivos:
          gs://smartbetting-landingzone/futebol/fixture_player_stats/raw_futebol_fixture_player_stats_{fixture_id}.json.
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/fixture_player_stats/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: fixture_id
            description: "ID do jogo na API-Football (FK p/ fact_fixtures). N linhas por fixture."
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: total_players
            description: "Metadata: nº de jogadores do jogo (ambos os times). Ignorado downstream."
          - name: team
            description: "STRUCT<id INT64, name STRING, logo STRING>. Time do jogador."
          - name: player
            description: "STRUCT<id INT64, name STRING, photo STRING>. id é o player_id."
          - name: statistics
            description: >
              STRUCT único (statistics[0] da API) com games STRUCT<minutes, number,
              position, rating STRING, captain BOOL, substitute BOOL>, offsides, shots
              STRUCT<total, on>, goals STRUCT<total, conceded, assists, saves>, passes
              STRUCT<total, key, accuracy STRING>, tackles, duels, dribbles, fouls
              STRUCT<drawn, committed>, cards STRUCT<yellow, red>, penalty STRUCT<won,
              commited(SIC), scored, missed, saved>. Achatado/tipado em stg.

      - name: raw_futebol_team_season_stats
        description: >
          Agregados de temporada por time (/teams/statistics). 1 linha por (time, liga,
          season), 1 arquivo por mode (latest-only). Input direto pro modelo Poisson
          (força ataque/defesa, médias casa/fora). O objeto único da API foi curado numa
          forma aninhada (fixtures/goals/clean_sheet/failed_to_score/biggest/penalty) —
          buckets por minuto, under_over, cards e lineups[] descartados. snapshot_date é a
          data da coleta (chave de partição em fact_team_season_stats). Schema explícito:
          goals.*.average e penalty.*.percentage vêm STRING (cast em stg). Arquivos:
          gs://smartbetting-landingzone/futebol/team_season_stats/raw_futebol_team_season_stats_{current|backfill}.json.
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/team_season_stats/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: requested_league_id
            description: "ID da liga requisitada (parâmetro `league` da chamada). Base do competition."
          - name: requested_season
            description: "Ano da temporada requisitada"
          - name: snapshot_date
            description: "Data (UTC) da coleta dos agregados — chave de partição no fato (DATE)"
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: total_teams
            description: "Metadata: nº de times coletados no arquivo. Ignorado downstream."
          - name: team
            description: "STRUCT<id INT64, name STRING, logo STRING>. id é o team_id."
          - name: form
            description: "Sequência de resultados da temporada (ex: 'WDLWW...'). STRING."
          - name: fixtures
            description: "STRUCT<played, wins, draws, loses : STRUCT<home INT64, away INT64, total INT64>>."
          - name: goals
            description: >
              STRUCT<for, against : STRUCT<total STRUCT<home,away,total INT64>,
              average STRUCT<home,away,total STRING>>>. average vem STRING ('1.5') — cast em stg.
          - name: clean_sheet
            description: "STRUCT<home INT64, away INT64, total INT64>. Jogos sem sofrer gol."
          - name: failed_to_score
            description: "STRUCT<home INT64, away INT64, total INT64>. Jogos sem marcar."
          - name: biggest
            description: >
              STRUCT<streak STRUCT<wins,draws,loses INT64>, wins STRUCT<home,away STRING>,
              loses STRUCT<home,away STRING>, goals STRUCT<for STRUCT<home,away INT64>,
              against STRUCT<home,away INT64>>>. wins/loses são placares ('3-0').
          - name: penalty
            description: >
              STRUCT<scored STRUCT<total INT64, percentage STRING>, missed STRUCT<total INT64,
              percentage STRING>, total INT64>. percentage vem '100%' — cast em stg.

      - name: raw_futebol_standings
        description: >
          Snapshot diário da tabela do campeonato (/standings). N linhas por (liga, season,
          snapshot_date) — 1 por time×grupo; grupos da Copa achatados no extractor (coluna
          group), incluindo o "Ranking of third-placed teams" (mesmo time aparece 2×: no
          grupo e no ranking de terceiros — group integra a chave única downstream).
          Diferente dos demais (latest-only): 1 arquivo por dia+mode, date-stampado — o GCS
          acumula o histórico de evolução e re-rodar no mesmo dia sobrescreve o mesmo arquivo
          (idempotente). snapshot_date é a data da coleta (chave de partição em
          fact_standings_snapshot); a API não tem histórico diário, então o backfill é a tabela
          FINAL de 2024/2025. Schema explícito (all/group/goals.for são keywords SQL — crases
          no stg). Arquivos:
          gs://smartbetting-landingzone/futebol/standings/raw_futebol_standings_{current|backfill}_{YYYY-MM-DD}.json.
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/standings/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: requested_league_id
            description: "ID da liga requisitada (parâmetro `league` da chamada). Base do competition."
          - name: requested_season
            description: "Ano da temporada requisitada"
          - name: snapshot_date
            description: "Data (UTC) da coleta do snapshot — chave de partição no fato (DATE)"
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: total_rows
            description: "Metadata: nº de linhas coletadas no arquivo. Ignorado downstream."
          - name: rank
            description: "Posição na tabela (1 = líder)"
          - name: team
            description: "STRUCT<id INT64, name STRING, logo STRING>. id é o team_id."
          - name: points
            description: "Pontos somados na temporada"
          - name: goalsDiff
            description: "Saldo de gols (INT64)"
          - name: group
            description: "Grupo/divisão na API ('Serie A'; 'Group A'... na Copa). Keyword SQL — crases."
          - name: form
            description: "Últimos 5 resultados (ex: 'WWDLW'). Pode vir null no início da temporada."
          - name: status
            description: "Movimento vs rodada anterior: 'same' | 'up' | 'down'"
          - name: description
            description: "Zona da classificação ('Promotion - Copa Libertadores', 'Relegation'...) ou null"
          - name: all
            description: >
              Campanha geral: STRUCT<played, win, draw, lose INT64,
              goals STRUCT<for INT64, against INT64>>. Keyword SQL — crases no stg.
          - name: home
            description: "Campanha como mandante (mesmo STRUCT do all)"
          - name: away
            description: "Campanha como visitante (mesmo STRUCT do all)"
          - name: update
            description: "TIMESTAMP da última atualização da tabela na API (marca o fim real da temporada no backfill)"

      - name: raw_futebol_injuries
        description: >
          Snapshot diário de lesionados/suspensos (/injuries). N linhas por (liga, season,
          snapshot_date) — 1 por (player, fixture, type, reason); a API repete linhas exatas
          (dedup no fato). Diferente dos latest-only: 1 arquivo por
          dia+mode, date-stampado — o GCS acumula o histórico e re-rodar no mesmo dia sobrescreve
          o mesmo arquivo (idempotente). snapshot_date é a data da coleta (chave de partição em
          fact_injuries_snapshot). type ∈ {Missing Fixture, Questionable}; reason é texto livre
          (inclui suspensões). Schema explícito (type/reason STRING aninhados em player; fixture.date ISO→TIMESTAMP).
          ⚠️ Só Brasileirão (71) tem coverage.injuries=TRUE; Copa do Mundo (1), Série B (72),
          Copa do Brasil (73), Libertadores (13) e Sudamericana (11) ficam fora (Libertadores
          2025 FOI TRUE — rechecar 2026 em agosto; Sudamericana FALSE em 2024/25/26, sem
          recheck). Arquivos:
          gs://smartbetting-landingzone/futebol/injuries/raw_futebol_injuries_{current|backfill}_{YYYY-MM-DD}.json.
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/injuries/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: requested_league_id
            description: "ID da liga requisitada (parâmetro `league` da chamada). Base do competition."
          - name: requested_season
            description: "Ano da temporada requisitada"
          - name: snapshot_date
            description: "Data (UTC) da coleta do snapshot — chave de partição no fato (DATE)"
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: total_rows
            description: "Metadata: nº de linhas coletadas no arquivo. Ignorado downstream."
          - name: player
            description: "STRUCT<id INT64, name STRING, photo STRING, type STRING, reason STRING>. ⚠️ type/reason vêm ANINHADOS aqui (não no topo): type ∈ {Missing Fixture, Questionable}; reason é texto livre (inclui suspensões). id é o player_id."
          - name: team
            description: "STRUCT<id INT64, name STRING, logo STRING>. Time do jogador."
          - name: fixture
            description: "STRUCT<id INT64, timezone STRING, date TIMESTAMP, timestamp INT64>. Jogo que o jogador vai desfalcar."
          - name: league
            description: "STRUCT<id INT64, season INT64, name STRING, country STRING, logo STRING, flag STRING>."

      - name: raw_futebol_odds
        description: >
          Snapshot pré-jogo de odds (/odds) — coração do value betting (CLV/EV/movimento de
          linha). FORWARD-ONLY, em 2 janelas por jogo (collection_window: t24h = linha de
          abertura ~24h antes; t1h = linha perto do fechamento ~1h antes). N linhas por
          (fixture, janela) — 1 por CASA; bets/values aninhados (UNNEST em stg_futebol_odds).
          1 arquivo por (fixture, janela): raw_futebol_odds_{fixture}_{t24h|t1h}.json
          (skip-if-exists = 1 snapshot por janela). Guarda TODAS as casas/mercados; o
          afunilamento p/ os 8 mercados-alvo é no fact_odds_snapshot. odd/value vêm STRING
          (cast em stg); collection_timestamp/api_update ISO→TIMESTAMP; kickoff_timestamp
          unix INT64. Brasileirão (71) + Copa do Mundo (1) + Série B (72) 2026 (todos
          coverage.odds=TRUE); Copa do Brasil (73) e Libertadores (13) ARMADAS em
          FUTEBOL_ODDS_LEAGUE_IDS desde 2026-07-13, Sudamericana (11) desde 2026-07-14
          (coverage.odds sazonal de mata-mata — dormentes até a banda t24h: Sudamericana
          ~20/07 (R32 21–31/07), CdB ~31/07, Libertadores 10/08). Arquivos:
          gs://smartbetting-landingzone/futebol/odds/raw_futebol_odds_{fixture}_{t24h|t1h}.json.
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/odds/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: fixture_id
            description: "ID do jogo na API-Football (FK p/ fact_fixtures). N linhas por (fixture, janela)."
          - name: league_id
            description: "ID da liga (71 = Brasileirão, 1 = Copa do Mundo, 72 = Série B, 73 = Copa do Brasil, 13 = Libertadores, 11 = Sudamericana). Base do competition."
          - name: season
            description: "Ano da temporada"
          - name: collection_window
            description: "Janela da coleta: 't24h' (linha de abertura) | 't1h' (perto do fechamento)."
          - name: collection_timestamp
            description: "TIMESTAMP (UTC) do momento da coleta — chave de partição no fato (DATE dela)."
          - name: kickoff_timestamp
            description: "Unix UTC do kickoff (INT64). TIMESTAMP_SECONDS no stg p/ calcular minutes_to_kickoff."
          - name: api_update
            description: "TIMESTAMP da última atualização das odds na API (campo `update` do /odds)."
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: total_bookmakers
            description: "Metadata: nº de casas no snapshot do jogo. Ignorado downstream."
          - name: bookmaker_id
            description: "ID da casa na API-Football (4 = Pinnacle/sharp de referência, 8 = Bet365...)."
          - name: bookmaker_name
            description: "Nome da casa (cluster key no fato)."
          - name: bets
            description: >
              ARRAY<STRUCT<id INT64, name STRING, values ARRAY<STRUCT<value STRING, odd STRING>>>>.
              id = market_id (1=Match Winner, 4=Asian Handicap, 5=Goals O/U, 6=Goals O/U 1st Half,
              7=HT/FT, 8=BTTS, 10=Exact Score, 12=Double Chance...). value = rótulo do outcome;
              odd = decimal STRING. UNNEST 2× em stg_futebol_odds.

      - name: raw_futebol_predictions
        description: >
          Previsão pré-jogo do algoritmo da própria API-Football (/predictions) — BASELINE
          de comparação p/ avaliar um modelo próprio (não é produto) + fonte da corroboração
          `modelo_api_concorda` do Motor de Score. FORWARD-ONLY, 2 janelas date-stampadas
          ("daily" = varre jogos NS futuros ~2h–14d, 1x/dia; "t2h" = refresh perto do jogo),
          1 LINHA por fixture (1 previsão/jogo): predictions/comparison aninhados
          (flatten por dot-access em stg_futebol_predictions, sem UNNEST). 1 arquivo por
          (fixture, janela, dia): raw_futebol_predictions_{fixture}_{janela}_{YYYY-MM-DD}.json
          (skip-if-exists por DIA; o fato dedup latest-wins por loaded_at → snapshot mais fresco);
          o raw acumula no GCS e o rebuild full lê tudo. Percentuais ("45%") e linhas de gol
          ("-1.5") vêm STRING (cast em stg); collection_timestamp ISO→TIMESTAMP;
          kickoff_timestamp unix INT64. Brasileirão (71) + Copa do Mundo (1) + Série B (72)
          + Copa do Brasil (73) + Libertadores (13) + Sudamericana (11) 2026 (todos
          coverage.predictions=TRUE; na Libertadores a janela daily só alcança as oitavas
          ~28/07; na Sudamericana a R32 de 21–31/07 já está na janela). Arquivos:
          gs://smartbetting-landingzone/futebol/predictions/raw_futebol_predictions_{fixture}_{janela}_{date}.json.
        external:
          # Documentação apenas — external table criada por
          # data-engineering/scripts/futebol/create_external_tables.py
          location: "gs://smartbetting-landingzone/futebol/predictions/*.json"
          options:
            format: NEWLINE_DELIMITED_JSON
        columns:
          - name: fixture_id
            description: "ID do jogo na API-Football (FK p/ fact_fixtures). 1 linha por fixture."
          - name: league_id
            description: "ID da liga (71 = Brasileirão, 1 = Copa do Mundo, 72 = Série B, 73 = Copa do Brasil, 13 = Libertadores, 11 = Sudamericana). Base do competition."
          - name: season
            description: "Ano da temporada"
          - name: collection_window
            description: "Janela da coleta: 'daily' (varredura diária de jogos futuros, ~2h–14d) | 't2h' (refresh perto do kickoff)."
          - name: collection_timestamp
            description: "TIMESTAMP (UTC) do momento da coleta — chave de partição no fato (DATE dela)."
          - name: kickoff_timestamp
            description: "Unix UTC do kickoff (INT64). TIMESTAMP_SECONDS no stg."
          - name: loaded_at
            description: "Timestamp ISO UTC quando o extractor coletou a linha"
          - name: predictions
            description: >
              STRUCT<winner STRUCT<id INT64, name STRING, comment STRING>, win_or_draw BOOL,
              under_over STRING, goals STRUCT<home STRING, away STRING>, advice STRING,
              percent STRUCT<home STRING, draw STRING, away STRING>>. Percentuais "45%",
              linhas de gol/under_over "-1.5" — cast em stg.
          - name: comparison
            description: >
              STRUCT com 7 métricas de comparação home vs away {form, att, def,
              poisson_distribution, h2h, goals, total}, cada uma STRUCT<home STRING, away STRING>
              (percentuais "45%"). Cast em stg. (def é keyword SQL — crases no stg.)

  # Artefatos CONGELADOS da medição da task [F] (issue #49, ADR 0007). Não são modelos e nenhum
  # `dbt run` os reconstrói: foram criados uma vez pelo analyses/taskf_congela_baseline.sql, ANTES
  # de as vars pit_escopo/pit_recorte entrarem no int_futebol_team_form_pit, e é essa anterioridade
  # que dá valor a eles. O schema é fixo em `futebol_taskF` de propósito — o baseline não segue o
  # target, senão a Costura A compararia produção contra ela mesma rodada com --target dev/prod.
  # Exceção consciente ao "só modelo de staging lê source": os consumidores são o teste singular da
  # Costura A (sobre os baselines) e a análise de reconciliação da #51 (sobre o taskf_teste2), e
  # `source()` é o único handle do dbt para uma tabela que não é modelo. Nenhum MODELO lê daqui —
  # se um dia ler, a medição terá vazado para o caminho que o board serve.
  - name: futebol_taskF
    description: >
      Dataset de medição da task [F] (ADR 0007). Guarda o baseline de equivalência da Costura A.
    database: smartbetting-dados
    schema: futebol_taskF
    tables:
      - name: baseline_int_futebol_team_form_pit
        description: >
          A saída do int_futebol_team_form_pit no código anterior às vars de escopo/recorte,
          sem dbt_loaded_at (que muda a cada build por construção e não é comportamento).
          Lado esquerdo da igualdade de assert_taskf_pit_default_igual_baseline.

      # ⚠️ `baseline_pit_fingerprint` (a digital ANTIGA, por (competition_id, season)) saiu daqui
      # na #123. A tabela continua no dataset como registro histórico, pelo mesmo precedente das
      # cópias `baseline_*_pre91`, mas a declaração sai porque source que ninguém lê é convite a
      # alguém voltar a lê-la — e essa partição é mais grossa que o fecho da conta desde que a #91
      # virou o default para `pit_escopo: todas`. Ver a emenda à ADR 0007.
      - name: baseline_pit_fingerprint_linha
        description: >
          Impressão digital do INSUMO do modelo por LINHA (fixture_id, team_id) no instante do
          congelamento. É o que deixa a Costura A ser exata sem ser frágil: fixture novo, resultado
          que entra e jogo remarcado mudam legitimamente a saída, e a guarda compara só as linhas
          cujo insumo é idêntico ao congelado.

          O grão é por linha porque a linha É o fecho da conta desde a #91 — sob `pit_escopo:
          todas` a linha lê o histórico do time em toda competição, e a partição por
          (competition_id, season) passou a declarar comparáveis linhas cujo insumo mudou fora do
          recorte. Ela não ficava frouxa: ficava mentirosa. Emenda à ADR 0007, verbete "Fecho de
          uma linha" no CONTEXT.md, issue #123.

          Produzida pela macro taskf_fingerprint_insumo_pit(), a MESMA que o teste usa — se as duas
          divergirem, NENHUMA linha casa e a guarda fica vazia, não vermelha. É o piso de cobertura
          que transforma essa vacuidade em vermelho.
        columns:
          - name: fixture_id
            description: "A âncora de tempo — o jogo cuja linha está sendo digitalizada"
          - name: team_id
            description: "O time da linha (um dos dois lados do jogo)"
          - name: competition_id
            description: "Competição da âncora. Diagnose e legibilidade; não entra no join da guarda."
          - name: season
            description: "Temporada da âncora. Diagnose; não entra no join da guarda."
          - name: fp_ancora
            description: >
              FARM_FINGERPRINT dos campos da PRÓPRIA âncora que a linha lê (fixture_id,
              competition, competition_id, season, kickoff, os dois team_id). ⚠️ SEM status e SEM
              placar: a linha de F não lê o resultado de F, e digitalizá-lo faria toda linha
              quebrar quando o próprio jogo acontecesse.
          - name: n_hist_time_disponivel
            description: >
              Quantos jogos encerrados anteriores o time tinha, em qualquer competição, SEM o teto
              do recorte. É o insumo do `played_total_disponivel`, que é coluna de saída e é o que
              o piso de amostra do task01_base() lê.
          - name: n_hist_time_usado
            description: "Quantos desses jogos sobreviveram ao teto de 10 e alimentaram as médias."
          - name: fp_hist_time
            description: >
              BIT_XOR(FARM_FINGERPRINT(...)) sobre os 10 jogos anteriores do time, em qualquer
              competição. `fixture_id` entra no struct porque BIT_XOR de dois structs idênticos se
              CANCELA. Independente de ordem.
          - name: n_hist_comp
            description: "Quantos jogos encerrados de (C,S) inteiro precediam a âncora."
          - name: fp_hist_comp
            description: >
              BIT_XOR(FARM_FINGERPRINT(...)) sobre os jogos anteriores de (C,S) inteiro, de TODOS
              os times. É o insumo do CTE `tabela` (ADR 0008) e portanto de points/goal_diff/ppg —
              e do `rank`, que ranqueia o time contra os adversários de grupo. Sem ele a digital
              seria mentirosa: adversário com placar corrigido muda o rank do time sem tocar em
              nenhum jogo dele.
          - name: n_roster
            description: "Quantos times distintos (C,S) tinha — é o `n_teams`, coluna de saída."
          - name: fp_roster
            description: >
              BIT_XOR(FARM_FINGERPRINT(team_id)) sobre o conjunto DISTINTO de times de (C,S),
              inclusive os de jogos futuros. ⚠️ Conjunto de TIMES e nunca de fixtures: time novo
              muda `n_teams` de verdade e tem de quebrar a linha; jogo novo de um time que já
              estava lá, não. Digitalizar fixtures aqui reproduziria a armadilha do recorte "por
              time", em que um jogo de amanhã invalida uma linha de 2024.
          - name: n_grupos
            description: "Quantos times tinham grupo resolvido em (C,S)"
          - name: fp_standings
            description: >
              BIT_XOR(FARM_FINGERPRINT(...)) sobre (team_id, group_name) do team_group JÁ
              RESOLVIDO — não do snapshot cru, que ganha uma linha por dia e jogaria tudo fora da
              comparação.
          - name: fp_insumo_linha
            description: >
              A digital combinada dos cinco insumos acima. É a ÚNICA coluna que entra no join da
              guarda; as outras existem para dizer QUAL insumo se mexeu quando a cobertura cai.

      - name: baseline_pit_meta
        description: >
          Quando o baseline foi congelado, de qual commit, e com quantas linhas. Uma linha só.
          ⚠️ A coluna `n_particoes` virou `n_linhas_digital` na #123, junto com o grão da digital.

      - name: taskf_teste2_54
        description: >
          As quatro células como a #54 as mediu (execução de 12/08 18:29–18:32, commit d40634d),
          copiadas ANTES de a #55 dropar a acumulativa para acrescentar `odds_loaded_at`. Não tem
          essa coluna, e é a única diferença de schema.

          Existe porque a #54 aprendeu a lição do jeito caro: ela fez a mesma comparação com uma
          cópia tratada como rascunho, removida em seguida, e os números daquele parágrafo do doc
          de resultados não são re-deriváveis de `analyses/` até hoje. Declarada aqui, a
          comparação da re-medição (analyses/taskf_remedicao.sql) continua rodando amanhã.

          ⚠️ É um registro histórico, como os baselines acima: não se escreve nela. Quando uma
          mudança de schema futura exigir outra re-medição, o caminho é copiar a acumulativa para
          uma tabela nova com o número do ticket, não sobrescrever esta.

      - name: taskf_teste2_55
        description: >
          As quatro células como a #55 as mediu (execução de 12/08 19:55–20:05, commit b535130),
          copiadas ANTES de a #58 dropar a acumulativa para acrescentar a coluna `universo`. Não
          tem essa coluna, e é a única diferença de schema — o que ela contém equivale ao universo
          `completo` de hoje, que é contra o que a re-medição a compara.

          Mesmo papel e mesmas regras da taskf_teste2_54 acima: registro histórico, não se escreve
          nela, e a próxima mudança de schema cria a sua própria cópia com o número do ticket.

      - name: taskf_teste2_ancora
        description: >
          A ÂNCORA DA REMEDIÇÃO (#82, ADR 0010): a célula `ambos` medida de novo sob o código que a
          #91 virou default, no mesmo universo congelado e com o mesmo schema da acumulativa ao
          lado. É o lado esquerdo da única conferência que sobrevive à troca de janela — o Teste 2
          do pipeline novo, rodado sobre a janela congelada, tem de reproduzi-la.

          ⚠️ Ela existe SEPARADA da taskf_teste2 por um motivo medido, não por organização: a
          primeira invariante da Costura B cobra `git_sha` idêntico nas quatro células, então
          sobrescrever `ambos` com uma medição de outro commit deixaria o 2×2 de ser uma
          comparação — e a ADR 0010 promete que `futebol_taskF` permanece o registro congelado
          dele. Escrita pelo MESMO analyses/taskf_teste2.sql, com `--vars '{taskf_destino: ancora}'`
          (macros/taskf_destino.sql, fail-closed).

          ⚠️ O que a invalida: qualquer mudança em `task01_base`, no de-vig, no
          int_futebol_team_form_pit ou nos cinco modelos de premissas entre a medição dela e a
          remedição. O `git_sha` da linha é o que permite conferir isso depois.

      - name: taskf_teste2_ancora_p1
        description: >
          A PRIMEIRA das duas passadas da #82: a célula `ambos` sob o código pós-#91 mas ANTES da
          #113, ou seja, ainda com a linha de quarto entrando no universo como se fosse meia.
          Existe para que o movimento entre a célula de 12–13/08 e a âncora seja decomponível em
          DUAS causas em vez de uma só — 12–13/08 → P1 é o efeito de #78 + #71 + #91 sobre a
          medição; P1 → âncora é o efeito do universo corrigido pela #113. Sem ela, o delta
          misturaria quatro causas e um defeito se esconderia dentro dele.

          ⚠️ Registro histórico, como as taskf_teste2_54/_55: não se escreve nela. Comparada por
          analyses/taskf_remedicao.sql com `--vars '{taskf_remedicao_agora: taskf_teste2_ancora,
          taskf_remedicao_anterior: taskf_teste2_ancora_p1}'`.

      - name: taskf_teste2_ancora_pre_a1
        description: >
          A ÂNCORA DE ANTES DA A1 (#103), preservada por `bq cp` no instante em que a #103 a
          re-rodou. A A1 mexeu no `int_futebol_premissas_ou` e no `task01_base`, que é
          exatamente a lista do "o que a invalida" da taskf_teste2_ancora acima — então a
          âncora foi remedida no mesmo PR, e a versão de commit `6f9dcc6` virou esta cópia.

          ⚠️ Registro histórico, como as taskf_teste2_54/_55 e a _p1: não se escreve nela. Ela
          é o lado ANTERIOR do delta que dimensiona a re-medição — `analyses/taskf_remedicao.sql`
          com `--vars '{taskf_remedicao_agora: taskf_teste2_ancora, taskf_remedicao_anterior:
          taskf_teste2_ancora_pre_a1}'`. Precedente do nome: as cópias `baseline_*_pre91` da #91.

      - name: taskf_pit_por_celula_ancora
        description: >
          O carimbo do PIT da âncora — mesma relação com o taskf_pit_por_celula que a
          taskf_teste2_ancora tem com a taskf_teste2, e escrito na mesma execução (#82).

      - name: taskf_teste2
        description: >
          A saída do Teste 2 da medição, uma linha por (célula, UNIVERSO, mercado, premissa,
          benchmark).
          Acumulativa: cada execução de analyses/taskf_teste2.sql substitui SÓ a sua célula
          (DELETE + INSERT), com os quatro universos dentro dela, e as quatro células convivem —
          é sobre esta tabela que a Costura B (#55) verifica as suas invariantes. Também não é modelo, pelo mesmo motivo dos baselines
          acima: o destino está escrito no SQL e fixo em futebol_taskF, então um `dbt build`
          distraído não tem como publicá-la no dataset do board.
        columns:
          - name: celula
            description: >
              base | escopo | recorte | ambos. DERIVADA dos dois eixos por taskf_celula(), nunca
              digitada — uma célula não tem como ser gravada com o nome de outra.
          - name: pit_escopo
            description: "O eixo de escopo que produziu a linha (da_competicao | todas)"
          - name: pit_recorte
            description: "O eixo de recorte que produziu a linha (temporada | ultimos_10)"
          - name: universo
            description: >
              QUAIS JOGOS entram na conta desta linha (#58): completo | sem_copa_mundo |
              estendido | estendido_sem_champions_classif. É um eixo ORTOGONAL à célula — a célula
              diz qual HISTÓRICO cada jogo carrega, o universo diz quais jogos são medidos —, e
              não tem relação nenhuma com `janela`, que neste repositório é a janela de coleta de
              odds. Os quatro universos de uma célula saem do MESMO INSERT, para que a diferença
              entre dois deles não carregue uma reconstrução dos modelos dentro de si. Definições
              e predicados em macros/taskf_universos.sql.

              ⚠️ TODO consumidor precisa recortar o universo. Sem o filtro, cada premissa aparece
              quatro vezes e `jogos_no_universo` tem quatro valores. O default de quem lê é
              `completo`, que é o universo congelado da [0.1] e o primário da medição.
          - name: medido_em
            description: >
              Quando a célula foi materializada. Existe porque a spec exige que as quatro rodem na
              MESMA execução — `linha_subindo`/`linha_descendo` liam odds ao vivo e viravam sozinhas
              entre builds. Com o carimbo, "mesma execução" é conferível; sem ele, é confiança.

              ⚠️ O TEMPO VERBAL É PASSADO desde a #103 (ADR 0012): as duas premissas foram
              REMOVIDAS, e essa instabilidade é metade do motivo. O carimbo continua valendo — as
              quatro células têm de rodar na mesma execução de qualquer forma, porque a #55 e a
              #92 mediram deriva de recomputação que não vem daquelas duas —, e as células JÁ
              MATERIALIZADAS foram medidas quando elas existiam.
          - name: git_sha
            description: "Commit de onde a célula foi medida (var taskf_git_sha)"
          - name: odds_loaded_at
            description: >
              O `dbt_loaded_at` do fact_odds_snapshot que ESTA célula leu — qual construção dos
              fatos alimentou a medição. Carimbado na linha, e não conferido ao vivo depois, por
              duas razões: lido ao vivo ele decai (um rebuild posterior no dataset de medição
              deixaria a conferência vermelha sem que as quatro células tivessem deixado de ser
              comparáveis), e um ref() penduraria a guarda no grafo do fact_odds_snapshot, que a
              arrastaria para dentro dos builds da medição por seleção indireta. Com ele, a
              primeira invariante da Costura B cobra as duas pontas: idêntico nas quatro (mesma
              construção) e anterior ao `medido_em` de cada uma (os fatos vieram antes).
          - name: jogos_no_universo
            description: >
              Jogos distintos do universo DESTA LINHA. Desde a #58 ele é por universo — 169 no
              `completo`, 90 no `sem_copa_mundo`, e os dois estendidos crescem com a construção
              dos fatos. O que continua idêntico por construção, e é a primeira invariante da
              Costura B, é o valor entre as QUATRO CÉLULAS de um MESMO universo.
          - name: usado_para_peso
            description: >
              A linha está no benchmark PREFERIDO do mercado (sharp p/ 1X2, Handicap e Gols;
              derivada p/ Dupla Chance; consenso p/ BTTS). As de consenso do Handicap e do Gols
              vêm FALSE: não pesam, mas ficam visíveis porque o ROI muito pior delas é informação
              sobre quais jogos a Pinnacle escolhe precificar.
          - name: jogos_medios_disp
            description: >
              Média do `min_jogos` DISPONÍVEL (sem teto) nas linhas em que a premissa acendeu. É a
              contagem que o piso corta, e a que a [0.1] publicou como `jogos_medios` — nas
              células de recorte `temporada` as duas contagens são o mesmo número.
          - name: jogos_medios_usado
            description: >
              Média do `min_jogos` USADO — o que de fato alimentou as médias das premissas. Sob
              recorte de contagem ele satura em 10, e a diferença para o `_disp` é exatamente
              quanto de histórico o teto deixou de fora.

      - name: taskf_pit_por_celula
        description: >
          A contagem de partidas anteriores do int_futebol_team_form_pit, uma linha por (célula,
          fixture, time). Acumulativa como o taskf_teste2: cada execução de
          analyses/taskf_pit_por_celula.sql substitui SÓ a sua célula. Existe porque o PIT é uma
          tabela só no dataset de medição — cada célula sobrescreve a anterior —, e a invariante
          de monotonicidade da #53 ("escopo >= base em todo par") é uma comparação ENTRE células.
          Guarda o PIT inteiro, sem recorte de universo: fan-out e perda de linha são defeitos do
          mecanismo e não se limitam à janela medida.
        columns:
          - name: celula
            description: >
              base | escopo | recorte | ambos. DERIVADA dos eixos por taskf_celula() em tempo de
              compilação. ⚠️ O rótulo vem das vars e o DADO vem do que está materializado: o
              carimbo tem de rodar DEPOIS do build da mesma célula. Rodar fora de ordem é pego
              pelo veredito de não-vacuidade da analyses/taskf_monotonicidade_escopo.sql.
          - name: played_total
            description: >
              A contagem USADA: partidas anteriores que ALIMENTARAM as médias, no escopo/recorte
              da célula e no instante do kickoff. Sob recorte de contagem ela satura no tamanho do
              recorte.
          - name: played_total_disponivel
            description: >
              A contagem DISPONÍVEL: quantas partidas anteriores EXISTEM no escopo da célula, sem
              teto. Nas células de recorte `temporada` é o próprio played_total (sem teto, as duas
              são a mesma coisa) e o modelo nem emite a coluna — a projeção acontece no carimbo.
              É desta que sai o `min_jogos` do jogo (o MENOR entre os dois times) que o piso de
              amostra corta, para o piso significar a mesma coisa nas quatro células.
              ⚠️ A identidade `usado = LEAST(disponível, N)` é CONFERIDA em
              analyses/taskf_saturacao_recorte.sql nas células com teto, onde as duas colunas vêm
              de contas diferentes do modelo. Nas células de recorte `temporada` ela é verdade por
              construção — a projeção acima —, e ali a mesma conferência checa o RÓTULO, não o
              dado: uma célula de `temporada` gravada como `ultimos_10` cairia na identidade com
              teto.
