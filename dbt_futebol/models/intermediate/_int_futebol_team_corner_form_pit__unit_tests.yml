version: 2

# ==============================================================================
# Unit tests do int_futebol_team_corner_form_pit (AE#159, spec #157).
#
# Um cenário só, desenhado para provar as quatro coisas que a AE#159 pede juntas:
#
#   1. TIME SEM HISTÓRICO — team_id 30 não tem nenhum jogo anterior: played_total=0,
#      played_mando5=0, as dez médias saem NULL. Degradação graciosa, não zero, não erro.
#
#   2. PONTO-NO-TEMPO CORTANDO CERTO — team_id 10 tem 12 jogos anteriores ao alvo (fixture
#      800 a 810, mais um "futuro" 900 com kickoff DEPOIS do alvo). A janela de 10 usa só os
#      dez mais recentes ANTES do apito: fixture 800 (o 11º mais recente) fica de fora — se
#      entrasse, o corner_kicks=99 dele apareceria na média — e a 900 (kickoff depois do
#      alvo) tem que ficar de fora mesmo sendo "passado" no calendário dos fixture_id.
#      played_total_disponivel=11 (conta os 11 anteriores ao alvo, sem o teto) prova que o
#      corte é do played_total (=10), não da fonte.
#
#   3. SELF-JOIN NÃO DUPLICA — os valores de corners_for e corners_against do time 10 vêm
#      de LINHAS DIFERENTES (a própria e a do adversário, time 20) e são distintos por
#      desenho (7 contra 2 em casa, 3 contra 5 fora). Se o self-join casasse a linha consigo
#      mesma, corners_against sairia igual a corners_for.
#
#   4. JANELA DE MANDO FILTRA O MANDO CERTO — dos 10 jogos de team_id 10, 5 são em casa
#      (corner_kicks=7) e 5 fora (corner_kicks=3). O alvo tem team_id 10 jogando em CASA, e
#      corners_for_avg_mando5 sai EXATAMENTE 7,0 — só os 5 jogos em casa — enquanto
#      corners_for_avg10 sai 5,0 (a média dos 10, casa e fora misturados). Os dois números
#      diferentes provam que o mando filtrou.
#
# AE#181 estende o MESMO cenário com os 5 insumos que faltavam (total_shots,
# shots_outsidebox, blocked_shots, goalkeeper_saves, fouls) — sem self-join, cada linha
# usa só a própria estatística do time. Valores por papel (casa/fora) de team_id 10 e 20:
#   team10 casa=(ts14,ob5,bs6,gs8,fl10)   team10 fora=(ts6,ob1,bs2,gs2,fl16)
#   team20 casa=(ts9,ob2,bs3,gs4,fl14)    team20 fora=(ts11,ob4,bs5,gs6,fl12)
# fixture 800 (o 11º jogo, fora da janela de 10) usa valores OUTLIER — se vazassem na janela
# de 10 ou na de mando eles contaminariam as médias em 809/810, então cruzar o piso ali com
# o número exato provado (nunca o outlier isolado) é o mesmo teste de vazamento que os
# escanteios já fazem com corner_kicks=99/1.
# ==============================================================================
unit_tests:
  - name: corner_pit_ponto_no_tempo_self_join_e_mando
    model: int_futebol_team_corner_form_pit
    description: >
      Time sem histórico degrada graciosamente para NULL; a janela de 10 corta no ponto-no-
      -tempo certo (nem o 11º jogo mais antigo, nem um jogo "futuro" entram); o self-join de
      escanteios sofridos não duplica (for != against); e a janela de mando isola só os jogos
      no mesmo lado do alvo. Estende com os 5 insumos sem self-join da AE#181 (total_shots,
      shots_outsidebox, blocked_shots, goalkeeper_saves, fouls), mesmo piso e mesmo corte.
    given:
      - input: ref('fact_fixtures')
        rows:
          # O 11º jogo mais recente de team_id 10 — tem que FICAR DE FORA da janela de 10.
          - {fixture_id: 800, competition_id: 1, season: 2026, kickoff_utc: '2026-01-01 12:00:00', home_team_id: 10, away_team_id: 20, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          # Os 10 jogos que FORMAM a janela — 5 em casa, 5 fora, intercalados.
          - {fixture_id: 801, competition_id: 1, season: 2026, kickoff_utc: '2026-02-01 12:00:00', home_team_id: 10, away_team_id: 20, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          - {fixture_id: 802, competition_id: 1, season: 2026, kickoff_utc: '2026-02-02 12:00:00', home_team_id: 20, away_team_id: 10, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          - {fixture_id: 803, competition_id: 1, season: 2026, kickoff_utc: '2026-02-03 12:00:00', home_team_id: 10, away_team_id: 20, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          - {fixture_id: 804, competition_id: 1, season: 2026, kickoff_utc: '2026-02-04 12:00:00', home_team_id: 20, away_team_id: 10, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          - {fixture_id: 805, competition_id: 1, season: 2026, kickoff_utc: '2026-02-05 12:00:00', home_team_id: 10, away_team_id: 20, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          - {fixture_id: 806, competition_id: 1, season: 2026, kickoff_utc: '2026-02-06 12:00:00', home_team_id: 20, away_team_id: 10, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          - {fixture_id: 807, competition_id: 1, season: 2026, kickoff_utc: '2026-02-07 12:00:00', home_team_id: 10, away_team_id: 20, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          - {fixture_id: 808, competition_id: 1, season: 2026, kickoff_utc: '2026-02-08 12:00:00', home_team_id: 20, away_team_id: 10, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          - {fixture_id: 809, competition_id: 1, season: 2026, kickoff_utc: '2026-02-09 12:00:00', home_team_id: 10, away_team_id: 20, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          - {fixture_id: 810, competition_id: 1, season: 2026, kickoff_utc: '2026-02-10 12:00:00', home_team_id: 20, away_team_id: 10, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}
          # O ALVO: team_id 10 em casa contra team_id 30 (sem histórico nenhum).
          - {fixture_id: 1, competition_id: 1, season: 2026, kickoff_utc: '2026-03-01 12:00:00', home_team_id: 10, away_team_id: 30, status_short: 'NS'}
          # "Futuro" relativo ao alvo — kickoff DEPOIS de 2026-03-01. Tem que ficar de fora.
          - {fixture_id: 900, competition_id: 1, season: 2026, kickoff_utc: '2026-04-01 12:00:00', home_team_id: 10, away_team_id: 20, status_short: 'FT', score_fulltime_home: 1, score_fulltime_away: 1}

      - input: ref('fact_fixture_stats')
        rows:
          # fixture 800 — fora da janela: valores extremos (99/1 nos escanteios; AE#181:
          # ts/ob/bs/gs/fl também em outlier) para denunciar se vazarem em 809 (mando) ou
          # 810 (avg10), os dois pontos que cruzam o piso com 800 ainda dentro do escopo.
          - {fixture_id: 800, team_id: 10, team_side: 'home', corner_kicks: 99, ball_possession: 50, expected_goals: 1.0, shots_insidebox: 5, total_shots: 39, shots_outsidebox: 30, blocked_shots: 31, goalkeeper_saves: 33, fouls: 35}
          - {fixture_id: 800, team_id: 20, team_side: 'away', corner_kicks: 1,  ball_possession: 50, expected_goals: 1.0, shots_insidebox: 5, total_shots: 36, shots_outsidebox: 29, blocked_shots: 30, goalkeeper_saves: 31, fouls: 37}
          # fixture 801 (team 10 EM CASA): 7 a favor, 2 sofridos.
          - {fixture_id: 801, team_id: 10, team_side: 'home', corner_kicks: 7, ball_possession: 60, expected_goals: 1.5, shots_insidebox: 6, total_shots: 14, shots_outsidebox: 5, blocked_shots: 6, goalkeeper_saves: 8, fouls: 10}
          - {fixture_id: 801, team_id: 20, team_side: 'away', corner_kicks: 2, ball_possession: 40, expected_goals: 0.5, shots_insidebox: 3, total_shots: 11, shots_outsidebox: 4, blocked_shots: 5, goalkeeper_saves: 6, fouls: 12}
          # fixture 802 (team 10 FORA): 3 a favor, 5 sofridos.
          - {fixture_id: 802, team_id: 20, team_side: 'home', corner_kicks: 5, ball_possession: 55, expected_goals: 1.2, shots_insidebox: 5, total_shots: 9, shots_outsidebox: 2, blocked_shots: 3, goalkeeper_saves: 4, fouls: 14}
          - {fixture_id: 802, team_id: 10, team_side: 'away', corner_kicks: 3, ball_possession: 45, expected_goals: 1.0, shots_insidebox: 4, total_shots: 6, shots_outsidebox: 1, blocked_shots: 2, goalkeeper_saves: 2, fouls: 16}
          # fixture 803 (casa) — repete o padrão de 801.
          - {fixture_id: 803, team_id: 10, team_side: 'home', corner_kicks: 7, ball_possession: 60, expected_goals: 1.5, shots_insidebox: 6, total_shots: 14, shots_outsidebox: 5, blocked_shots: 6, goalkeeper_saves: 8, fouls: 10}
          - {fixture_id: 803, team_id: 20, team_side: 'away', corner_kicks: 2, ball_possession: 40, expected_goals: 0.5, shots_insidebox: 3, total_shots: 11, shots_outsidebox: 4, blocked_shots: 5, goalkeeper_saves: 6, fouls: 12}
          # fixture 804 (fora) — repete o padrão de 802.
          - {fixture_id: 804, team_id: 20, team_side: 'home', corner_kicks: 5, ball_possession: 55, expected_goals: 1.2, shots_insidebox: 5, total_shots: 9, shots_outsidebox: 2, blocked_shots: 3, goalkeeper_saves: 4, fouls: 14}
          - {fixture_id: 804, team_id: 10, team_side: 'away', corner_kicks: 3, ball_possession: 45, expected_goals: 1.0, shots_insidebox: 4, total_shots: 6, shots_outsidebox: 1, blocked_shots: 2, goalkeeper_saves: 2, fouls: 16}
          # fixture 805 (casa).
          - {fixture_id: 805, team_id: 10, team_side: 'home', corner_kicks: 7, ball_possession: 60, expected_goals: 1.5, shots_insidebox: 6, total_shots: 14, shots_outsidebox: 5, blocked_shots: 6, goalkeeper_saves: 8, fouls: 10}
          - {fixture_id: 805, team_id: 20, team_side: 'away', corner_kicks: 2, ball_possession: 40, expected_goals: 0.5, shots_insidebox: 3, total_shots: 11, shots_outsidebox: 4, blocked_shots: 5, goalkeeper_saves: 6, fouls: 12}
          # fixture 806 (fora).
          - {fixture_id: 806, team_id: 20, team_side: 'home', corner_kicks: 5, ball_possession: 55, expected_goals: 1.2, shots_insidebox: 5, total_shots: 9, shots_outsidebox: 2, blocked_shots: 3, goalkeeper_saves: 4, fouls: 14}
          - {fixture_id: 806, team_id: 10, team_side: 'away', corner_kicks: 3, ball_possession: 45, expected_goals: 1.0, shots_insidebox: 4, total_shots: 6, shots_outsidebox: 1, blocked_shots: 2, goalkeeper_saves: 2, fouls: 16}
          # fixture 807 (casa).
          - {fixture_id: 807, team_id: 10, team_side: 'home', corner_kicks: 7, ball_possession: 60, expected_goals: 1.5, shots_insidebox: 6, total_shots: 14, shots_outsidebox: 5, blocked_shots: 6, goalkeeper_saves: 8, fouls: 10}
          - {fixture_id: 807, team_id: 20, team_side: 'away', corner_kicks: 2, ball_possession: 40, expected_goals: 0.5, shots_insidebox: 3, total_shots: 11, shots_outsidebox: 4, blocked_shots: 5, goalkeeper_saves: 6, fouls: 12}
          # fixture 808 (fora).
          - {fixture_id: 808, team_id: 20, team_side: 'home', corner_kicks: 5, ball_possession: 55, expected_goals: 1.2, shots_insidebox: 5, total_shots: 9, shots_outsidebox: 2, blocked_shots: 3, goalkeeper_saves: 4, fouls: 14}
          - {fixture_id: 808, team_id: 10, team_side: 'away', corner_kicks: 3, ball_possession: 45, expected_goals: 1.0, shots_insidebox: 4, total_shots: 6, shots_outsidebox: 1, blocked_shots: 2, goalkeeper_saves: 2, fouls: 16}
          # fixture 809 (casa).
          - {fixture_id: 809, team_id: 10, team_side: 'home', corner_kicks: 7, ball_possession: 60, expected_goals: 1.5, shots_insidebox: 6, total_shots: 14, shots_outsidebox: 5, blocked_shots: 6, goalkeeper_saves: 8, fouls: 10}
          - {fixture_id: 809, team_id: 20, team_side: 'away', corner_kicks: 2, ball_possession: 40, expected_goals: 0.5, shots_insidebox: 3, total_shots: 11, shots_outsidebox: 4, blocked_shots: 5, goalkeeper_saves: 6, fouls: 12}
          # fixture 810 (fora).
          - {fixture_id: 810, team_id: 20, team_side: 'home', corner_kicks: 5, ball_possession: 55, expected_goals: 1.2, shots_insidebox: 5, total_shots: 9, shots_outsidebox: 2, blocked_shots: 3, goalkeeper_saves: 4, fouls: 14}
          - {fixture_id: 810, team_id: 10, team_side: 'away', corner_kicks: 3, ball_possession: 45, expected_goals: 1.0, shots_insidebox: 4, total_shots: 6, shots_outsidebox: 1, blocked_shots: 2, goalkeeper_saves: 2, fouls: 16}
          # fixture 900 — "futuro" relativo ao alvo: valores extremos p/ denunciar se vazar.
          - {fixture_id: 900, team_id: 10, team_side: 'home', corner_kicks: 50, ball_possession: 50, expected_goals: 1.0, shots_insidebox: 5, total_shots: 14, shots_outsidebox: 5, blocked_shots: 6, goalkeeper_saves: 8, fouls: 10}
          - {fixture_id: 900, team_id: 20, team_side: 'away', corner_kicks: 1,  ball_possession: 50, expected_goals: 1.0, shots_insidebox: 5, total_shots: 11, shots_outsidebox: 4, blocked_shots: 5, goalkeeper_saves: 6, fouls: 12}

    expect:
      rows:
        # ⚠️ Cada fixture do `given` também é o seu PRÓPRIO alvo (o modelo calcula PIT p/
        # TODOS os fixtures, não só o "1") — por isso a lista abaixo tem uma linha por
        # (fixture, team) de TODO o cenário, não só do fixture 1. É o preço de testar contra
        # o modelo real em vez de um fixture-alvo isolado, e é também outra demonstração da
        # degradação graciosa: quase todas as linhas intermediárias têm played_total < 10 (ou
        # played_mando5 < 5) e por isso saem NULL — só as que cruzam o piso mostram número.
        #
        # AE#181: toda linha de `expect` precisa ter o MESMO conjunto de chaves (o
        # materialization de unit test do dbt monta um UNION ALL por linha usando as chaves
        # da própria linha — colunas divergentes entre linhas quebram a comparação). Por isso
        # as 10 colunas novas (5 insumos x 2 janelas) aparecem em TODAS as linhas abaixo, NULL
        # nas que não cruzam piso, número exato nas que cruzam.

        # ---- O ALVO (fixture 1): a comparação que prova o mando ---------------------------
        # team_id 10: 10 jogos na janela de 10 (800 fica de fora, 11 disponíveis). avg10
        # mistura casa (7/2) e fora (3/5) -> (5*7+5*3)/10=5.0 for, (5*2+5*5)/10=3.5 against.
        # mando5 (o alvo é EM CASA) isola só os 5 jogos de casa -> 7.0 for, 2.0 against exatos
        # — diferente do avg10, prova que o mando filtrou. Os 5 insumos novos (sem self-join,
        # só estatística própria): avg10 mistura casa/fora dos valores próprios do time 10
        # (ts 14/6 -> 10.0, ob 5/1 -> 3.0, bs 6/2 -> 4.0, gs 8/2 -> 5.0, fl 10/16 -> 13.0);
        # avg_mando5 isola só os 5 jogos de casa (ts 14.0, ob 5.0, bs 6.0, gs 8.0, fl 10.0).
        - {fixture_id: 1, team_id: 10, played_total: 10, played_total_disponivel: 11, corners_for_avg10: 5.0, corners_against_avg10: 3.5, played_mando5: 5, corners_for_avg_mando5: 7.0, corners_against_avg_mando5: 2.0, total_shots_avg10: 10.0, total_shots_avg_mando5: 14.0, shots_outsidebox_avg10: 3.0, shots_outsidebox_avg_mando5: 5.0, blocked_shots_avg10: 4.0, blocked_shots_avg_mando5: 6.0, goalkeeper_saves_avg10: 5.0, goalkeeper_saves_avg_mando5: 8.0, fouls_avg10: 13.0, fouls_avg_mando5: 10.0}
        # team_id 30: SEM HISTÓRICO — zero nas duas contagens, NULL nas médias das duas janelas
        # (as 5 antigas E as 5 novas: degradação graciosa não distingue insumo antigo de novo).
        - {fixture_id: 1, team_id: 30, played_total: 0, played_total_disponivel: 0, corners_for_avg10: null, corners_against_avg10: null, played_mando5: 0, corners_for_avg_mando5: null, corners_against_avg_mando5: null, total_shots_avg10: null, total_shots_avg_mando5: null, shots_outsidebox_avg10: null, shots_outsidebox_avg_mando5: null, blocked_shots_avg10: null, blocked_shots_avg_mando5: null, goalkeeper_saves_avg10: null, goalkeeper_saves_avg_mando5: null, fouls_avg10: null, fouls_avg_mando5: null}

        # ---- fixture 800 (o mais antigo — sem histórico ANTES dele) ------------------------
        - {fixture_id: 800, team_id: 10, played_total: 0, played_total_disponivel: 0, corners_for_avg10: null, corners_against_avg10: null, played_mando5: 0, corners_for_avg_mando5: null, corners_against_avg_mando5: null, total_shots_avg10: null, total_shots_avg_mando5: null, shots_outsidebox_avg10: null, shots_outsidebox_avg_mando5: null, blocked_shots_avg10: null, blocked_shots_avg_mando5: null, goalkeeper_saves_avg10: null, goalkeeper_saves_avg_mando5: null, fouls_avg10: null, fouls_avg_mando5: null}
        - {fixture_id: 800, team_id: 20, played_total: 0, played_total_disponivel: 0, corners_for_avg10: null, corners_against_avg10: null, played_mando5: 0, corners_for_avg_mando5: null, corners_against_avg_mando5: null, total_shots_avg10: null, total_shots_avg_mando5: null, shots_outsidebox_avg10: null, shots_outsidebox_avg_mando5: null, blocked_shots_avg10: null, blocked_shots_avg_mando5: null, goalkeeper_saves_avg10: null, goalkeeper_saves_avg_mando5: null, fouls_avg10: null, fouls_avg_mando5: null}

        # ---- fixtures 801..808: cada uma tem < 10 jogos anteriores -> avg10 sempre NULL;
        # a maioria também tem < 5 no mando -> mando também NULL. Só a contagem muda.
        - {fixture_id: 801, team_id: 10, played_total: 1, played_total_disponivel: 1, corners_for_avg10: null, corners_against_avg10: null, played_mando5: 1, corners_for_avg_mando5: null, corners_against_avg_mando5: null, total_shots_avg10: null, total_shots_avg_mando5: null, shots_outsidebox_avg10: null, shots_outsidebox_avg_mando5: null, blocked_shots_avg10: null, blocked_shots_avg_mando5: null, goalkeeper_saves_avg10: null, goalkeeper_saves_avg_mando5: null, fouls_avg10: null, fouls_avg_mando5: null}
        - {fixture_id: 801, team_id: 20, played_total: 1, played_total_disponivel: 1, corners_for_avg10: null, corners_against_avg10: null, played_mando5: 1, corners_for_avg_mando5: null, corners_against_avg_mando5: null, total_shots_avg10: null, total_shots_avg_mando5: null, shots_outsidebox_avg10: null, shots_outsidebox_avg_mando5: null, blocked_shots_avg10: null, blocked_shots_avg_mando5: null, goalkeeper_saves_avg10: null, goalkeeper_saves_avg_mando5: null, fouls_avg10: null, fouls_avg_mando5: null}
        - {fixture_id: 802, team_id: 10, played_total: 2, played_total_disponivel: 2, corners_for_avg10: null, corners_against_avg10: null, played_mando5: 0, corners_for_avg_mando5: null, corners_against_avg_mando5: null, total_shots_avg10: null, total_shots_avg_mando5: null, shots_outsidebox_avg10: null, shots_outsidebox_avg_mando5: null, blocked_shots_avg10: null, blocked_shots_avg_mando5: null, goalkeeper_saves_avg10: null, goalkeeper_saves_avg_mando5: null, fouls_avg10: null, fouls_avg_mando5: null}
        - {fixture_id: 802, team_id: 20, played_total: 2, played_total_disponivel: 2, corners_for_avg10: null, corners_against_avg10: null, played_mando5: 0, corners_for_avg_mando5: null, corners_against_avg_mando5: null, total_shots_avg10: null, total_shots_avg_mando5: null, shots_outsidebox_avg10: null, shots_outsidebox_avg_mando5: null, blocked_shots_avg10: null, blocked_shots_avg_mando5: null, goalkeeper_saves_avg10: null, goalkeeper_saves_avg_mando5: null, fouls_avg10: null, fouls_avg_mando5: null}
        - {fixture_id: 803, team_id: 10, played_total: 3, played_total_disponivel: 3, corners_for_avg10: null, corners_against_avg10: null, played_mando5: 2, corners_for_avg_mando5: null, corners_against_avg_mando5: null, total_shots_avg10: null, total_shots_avg_mando5: null, shots_outsidebox_avg10: null, shots_outsidebox_avg_mando5: null, blocked_shots_avg10: null, blocked_shots_avg_mando5: null, goalkeeper_saves_avg10: null, goalkeeper_saves_avg_mando5: null, fouls_avg10: null, fouls_avg_mando5: null}
        - {fixture_id: 803, team_id: 20, played_total: 3, played_total_disponivel: 3, corners_for_avg10: null, corners_against_avg10: null, played_mando5: 2, corners_for_avg_mando5: null, corners_against_avg_mando5: null, total_shots_avg10: null, total_shots_avg_mando5: null, shots_outsidebox_avg10: null, shots_outsidebox_avg_mando5: null, blocked_shots_avg10: null, blocked_shots_avg_mando5: null, goalkeeper_saves_avg10: null, goalkeeper_saves_avg_mando5: null, fouls_avg10: null, fouls_avg_mando5: null}
        - {fixture_id: 804, team_id: 10, played_total: 4, played_total_disponivel: 4, corners_for_avg10: null, corners_against_avg10: null, played_mando5: 1, corners_for_avg_mando5: null, corners_against_avg_mando5: null, total_shots_avg10: null, total_shots_avg_mando5: null, shots_outsidebox_avg10: null, shots_outsidebox_avg_mando5: null, blocked_shots_avg10: null, blocked_shots_avg_mando5: null, goalkeeper_saves_avg10: null, goalkeeper_saves_avg_mando5: null, fouls_avg10: null, fouls_avg_mando5: null}
