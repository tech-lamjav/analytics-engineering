version: 2

# ==============================================================================
# Unit test do fact_insumos_medidos (AE#175, ADR 0016).
#
# Prova três coisas juntas:
#   1. UNNEST vira uma linha por entrada do array, com market/line_value constantes.
#   2. valor NULL (insumo existia, sem dado) sobrevive ao achatamento — não vira 0, não
#      some (Insumo medido, CONTEXT.md).
#   3. outcome sem nenhum insumo aplicável (array vazio, ex. Draw no 1X2) não gera linha
#      nenhuma — não é bug, é o WHERE premissa IS NOT NULL de futebol_insumos_medidos()
#      já tendo descartado o não-aplicável antes do UNNEST existir.
# ==============================================================================
unit_tests:
  - name: fact_insumos_medidos_achata_um_array_por_linha
    model: fact_insumos_medidos
    description: >
      UNNEST produz uma linha por (premissa, insumo), preserva valor NULL, e outcome com
      array vazio não gera linha nenhuma.
    given:
      # format: sql porque insumos_medidos é ARRAY<STRUCT<...>>, e o formato de dicionário
      # entrega todo valor como escalar (mesmo motivo do premissas_cegas ser ARRAY<STRING>
      # em _int_futebol__unit_tests.yml).
      - input: ref('int_futebol_premissas_1x2')
        format: sql
        rows: |
          SELECT 1 AS fixture_id, 'Home' AS outcome, [
            STRUCT('forca_mismatch' AS premissa, 's_gf_venue' AS insumo, 1.8 AS valor),
            STRUCT('superioridade_xg' AS premissa, 's_xg_for' AS insumo, 1.49 AS valor),
            STRUCT('mando' AS premissa, 'pct_pts_home' AS insumo, CAST(NULL AS FLOAT64) AS valor)
          ] AS insumos_medidos
          UNION ALL
          SELECT 1, 'Draw', CAST([] AS ARRAY<STRUCT<premissa STRING, insumo STRING, valor FLOAT64>>)
      # AE#202: o fact lê também o Handicap. Vazio aqui — este teste é só do 1X2.
      - input: ref('int_futebol_premissas_ah')
        format: sql
        rows: |
          SELECT CAST(NULL AS INT64) AS fixture_id, CAST(NULL AS STRING) AS outcome,
                 CAST(NULL AS FLOAT64) AS line_value,
                 CAST([] AS ARRAY<STRUCT<premissa STRING, insumo STRING, valor FLOAT64>>) AS insumos_medidos
          FROM UNNEST([1]) WHERE FALSE
      # AE#208: o fact lê também o Ambos marcam. Vazio aqui — este teste é de outro mercado.
      - input: ref('int_futebol_premissas_btts')
        format: sql
        rows: |
          SELECT CAST(NULL AS INT64) AS fixture_id, CAST(NULL AS STRING) AS outcome,
                 CAST([] AS ARRAY<STRUCT<premissa STRING, insumo STRING, valor FLOAT64>>) AS insumos_medidos
          FROM UNNEST([1]) WHERE FALSE
    expect:
      rows:
        - {fixture_id: 1, outcome: 'Home', market: 'match_winner', line_value: , premissa: 'forca_mismatch', insumo: 's_gf_venue', valor: 1.8}
        - {fixture_id: 1, outcome: 'Home', market: 'match_winner', line_value: , premissa: 'superioridade_xg', insumo: 's_xg_for', valor: 1.49}
        - {fixture_id: 1, outcome: 'Home', market: 'match_winner', line_value: , premissa: 'mando', insumo: 'pct_pts_home', valor: }
        # fixture 1 / Draw: zero linhas — de propósito, não listadas aqui.

  # ============================================================================
  # AE#202: Handicap asiático. Mesmo jogo, mesmo lado (Home), duas linhas: em −0,5 o Home
  # dá handicap (favorito) e em +0,5 recebe (azarão). Prova que:
  #   1. market = 'asian_handicap' e line_value vem da linha, não NULL;
  #   2. o CONJUNTO de premissas muda com a linha (é por isso que a linha fica no grão,
  #      em vez de colapsar — decisão da #202);
  #   3. o mesmo insumo em duas premissas (s_ga_venue em tende_golear e em
  #      defesa_fora_solida) não colide: a premissa está no grão.
  # ============================================================================
  - name: fact_insumos_medidos_handicap_por_linha
    model: fact_insumos_medidos
    description: >
      Handicap entra com market asian_handicap e line_value populado; o conjunto de
      premissas segue o lado daquela linha (favorito em −0,5, azarão em +0,5).
    given:
      - input: ref('int_futebol_premissas_1x2')
        format: sql
        rows: |
          SELECT CAST(NULL AS INT64) AS fixture_id, CAST(NULL AS STRING) AS outcome,
                 CAST([] AS ARRAY<STRUCT<premissa STRING, insumo STRING, valor FLOAT64>>) AS insumos_medidos
          FROM UNNEST([1]) WHERE FALSE
      - input: ref('int_futebol_premissas_ah')
        format: sql
        rows: |
          SELECT 7 AS fixture_id, 'Home' AS outcome, -0.5 AS line_value, [
            STRUCT('tende_golear' AS premissa, 's_gf_venue' AS insumo, 2.1 AS valor),
            STRUCT('tende_golear' AS premissa, 's_ga_venue' AS insumo, 0.7 AS valor)
          ] AS insumos_medidos
          UNION ALL
          SELECT 7, 'Home', 0.5, [
            STRUCT('defesa_fora_solida' AS premissa, 's_ga_venue' AS insumo, 0.7 AS valor),
            STRUCT('raramente_perde_por_2' AS premissa, 's_lost2' AS insumo, CAST(NULL AS FLOAT64) AS valor)
          ]
      # AE#208: o fact lê também o Ambos marcam. Vazio aqui — este teste é de outro mercado.
      - input: ref('int_futebol_premissas_btts')
        format: sql
        rows: |
          SELECT CAST(NULL AS INT64) AS fixture_id, CAST(NULL AS STRING) AS outcome,
                 CAST([] AS ARRAY<STRUCT<premissa STRING, insumo STRING, valor FLOAT64>>) AS insumos_medidos
          FROM UNNEST([1]) WHERE FALSE
    expect:
      rows:
        - {fixture_id: 7, outcome: 'Home', market: 'asian_handicap', line_value: -0.5, premissa: 'tende_golear', insumo: 's_gf_venue', valor: 2.1}
        - {fixture_id: 7, outcome: 'Home', market: 'asian_handicap', line_value: -0.5, premissa: 'tende_golear', insumo: 's_ga_venue', valor: 0.7}
        - {fixture_id: 7, outcome: 'Home', market: 'asian_handicap', line_value: 0.5, premissa: 'defesa_fora_solida', insumo: 's_ga_venue', valor: 0.7}
        - {fixture_id: 7, outcome: 'Home', market: 'asian_handicap', line_value: 0.5, premissa: 'raramente_perde_por_2', insumo: 's_lost2', valor: }

  # ============================================================================
  # AE#208: Ambos marcam. Sem linha (line_value NULL, como o 1X2), e a saída é Yes/No.
  # Prova que:
  #   1. market = 'btts' e line_value NULL — o mercado não tem linha, e o grão não
  #      multiplica nada;
  #   2. o mesmo insumo em duas premissas de saídas diferentes (home_cs_pct em
  #      defesas_vazaveis, do Sim, e em defesa_forte, do Não) vira duas linhas que não
  #      colidem: a saída e a premissa estão no grão;
  #   3. valor NULL (histórico ausente) sobrevive ao achatamento.
  # ============================================================================
  - name: fact_insumos_medidos_btts_sem_linha
    model: fact_insumos_medidos
    description: >
      Ambos marcam entra com market btts e line_value NULL; cada saída publica as
      premissas dela, e o mesmo insumo em saídas diferentes não colide.
    given:
      - input: ref('int_futebol_premissas_1x2')
        format: sql
        rows: |
          SELECT CAST(NULL AS INT64) AS fixture_id, CAST(NULL AS STRING) AS outcome,
                 CAST([] AS ARRAY<STRUCT<premissa STRING, insumo STRING, valor FLOAT64>>) AS insumos_medidos
          FROM UNNEST([1]) WHERE FALSE
      - input: ref('int_futebol_premissas_ah')
        format: sql
        rows: |
          SELECT CAST(NULL AS INT64) AS fixture_id, CAST(NULL AS STRING) AS outcome,
                 CAST(NULL AS FLOAT64) AS line_value,
                 CAST([] AS ARRAY<STRUCT<premissa STRING, insumo STRING, valor FLOAT64>>) AS insumos_medidos
          FROM UNNEST([1]) WHERE FALSE
      - input: ref('int_futebol_premissas_btts')
        format: sql
        rows: |
          SELECT 9 AS fixture_id, 'Yes' AS outcome, [
            STRUCT('defesas_vazaveis' AS premissa, 'home_cs_pct' AS insumo, 50.0 AS valor),
            STRUCT('historico_btts' AS premissa, 'away_btts_cnt' AS insumo, CAST(NULL AS FLOAT64) AS valor)
          ] AS insumos_medidos
          UNION ALL
          SELECT 9, 'No', [
            STRUCT('defesa_forte' AS premissa, 'home_cs_pct' AS insumo, 50.0 AS valor)
          ]
    expect:
      rows:
        - {fixture_id: 9, outcome: 'Yes', market: 'btts', line_value: , premissa: 'defesas_vazaveis', insumo: 'home_cs_pct', valor: 50.0}
        - {fixture_id: 9, outcome: 'Yes', market: 'btts', line_value: , premissa: 'historico_btts', insumo: 'away_btts_cnt', valor: }
        - {fixture_id: 9, outcome: 'No', market: 'btts', line_value: , premissa: 'defesa_forte', insumo: 'home_cs_pct', valor: 50.0}
