version: 2

models:
  - name: int_futebol_odds_devig
    description: >
      Fase 0 do Motor de Score — núcleo de VALOR (agnóstico de mercado). De-vig market-aware
      da Pinnacle (bookmaker_id=4) na janela de fechamento (t15m>t1h>t24h) + edge + PTS_VALOR
      (0-30) + best/avg/n_casas + penalidades globais + linha_sharp. 1 linha por (fixture_id,
      market_id, outcome_side, line_value). DUPLA CHANCE (S5, market 12): a Pinnacle não precifica
      DC e as 3 saídas (1X/12/X2) NÃO são exaustivas (somam ~2) -> a prob_justa é DERIVADA do
      de-vig 1X2 da Pinnacle (dc_devig: P(1X)=P(Home)+P(Draw) etc.), valor_fonte=pinnacle,
      n_outcomes_valor=3. pinnacle_eval E consensus_devig EXCLUEM o market 12 (cai sempre no
      dc_devig). FALLBACK DE CONSENSO: mercados que a Pinnacle não precifica (BTTS=8, HT-FT=7) ->
      prob_justa/edge/PTS_VALOR na MEDIANA das casas, valor_fonte=consenso (estimativa no front);
      n_outcomes_valor=COALESCE(pin_n_outcomes, dc_n_1x2, cons_n_outcomes). COALESCE preserva
      1X2/O/U/AH (usam Pinnacle). AH: line_value na ótica do mandante, igual p/ Home/Away (par
      complementar). booksum_fechamento = Σ(1/odd) (=1+margem; NÃO é a margem) — renomeado de
      "overround". OBS: linhas inteiras/quarter de O/U(5)/AH(4) são gatadas no mart (push/split).
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: market_id
        tests: [not_null]
      - name: outcome_side
        tests: [not_null]
      - name: best_odd
        description: "Maior odd decimal entre TODAS as casas na janela de fechamento (preço apostado)."
        tests: [not_null]
      - name: avg_odd
        description: "Média das odds de TODAS as casas na janela (exibição). NÃO é a base do outlier."
      - name: avg_odd_ex_best
        description: >
          Média das odds DEIXANDO DE FORA a própria best_odd (leave-one-out). Base da penalidade
          pen_odd_outlier. NULL quando só há 1 casa (sem comparação possível -> penalidade FALSE).
      - name: n_casas
        description: "Casas distintas na janela (COUNT DISTINCT bookmaker_id)."
        tests: [not_null]
      - name: janela_usada
        description: "Janela de avaliação efetiva (t15m>t1h>t24h, a mais recente disponível)."
        tests: [not_null]
      - name: valor_fonte
        description: "Fonte do de-vig: 'pinnacle' (1X2/O/U/AH + DC derivada) | 'consenso' (BTTS/HT-FT) | NULL (sem de-vig)."
        tests:
          - accepted_values:
              arguments:
                values: ['pinnacle', 'consenso']
      - name: prob_justa_fechamento
        description: >
          Probabilidade justa (de-vig) do outcome em (0,1]. Pinnacle quando há; senão DC derivada
          do 1X2; senão consenso (mediana). NULL p/ mercados sem de-vig. Cada saída da DC é < 1
          (a SOMA das 3 saídas DC ~2, não cada uma).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: booksum_fechamento
        description: >
          Booksum Σ(1/odd) = normalizador = 1 + margem (NÃO é a margem; margem = booksum − 1).
          Da fonte usada (Pinnacle ou mediana). NULL na DC (prob derivada do 1X2, sem booksum)
          e NULL em linha com conjunto de saídas incompleto (spec #22 — a linha não emite valor).
        tests:
          # PROMOVIDO DE warn PARA error em 2026-08-05 (spec #22). Como aviso ele já estava
          # vermelho desde o primeiro dia, com correspondência PERFEITA: booksum < 1 ⟺ conjunto
          # de 1 saída ⟺ prob = 1,0, em 403 de 403 linhas, zero falso positivo. O bug era
          # detectável desde sempre — o que faltava era o aviso significar alguma coisa.
          # Agora que a regra de emissão elimina essas linhas (booksum vira NULL junto), ele
          # para de disparar e passa a valer: pega o caso em que o MAPA envelheceu — conjunto
          # completo segundo a declaração mas não segundo a realidade, com probabilidades
          # infladas e SEM a prob 1,0 para denunciar.
          # Continua sendo TESTE e não filtro: arbitragem real de mediana entre casas produz
          # booksum < 1 com conjunto completo, e como filtro isso descartaria uma linha boa em
          # silêncio. Como teste, o mesmo evento vira pergunta. Zero ocorrências na base atual.
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1.0
                inclusive: true
              config:
                severity: error
                tags: ['guarda']
      - name: edge
        description: "best_odd * prob_justa_fechamento − 1 (>= -1 por construção, odd>1 e prob>0). NULL sem de-vig."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                inclusive: true
      - name: n_outcomes_valor
        description: "Completude do conjunto usado p/ o VALOR (Pinnacle/DC=3/consenso). Base dos gates de completude no mart. NULL sem de-vig."
      - name: linha_sharp_confirma
        description: "Movimento sharp: odd Pinnacle do lado caiu t24h->t15m. FALSE (graceful) se faltar Pinnacle nas duas janelas."
        tests: [not_null]
      - name: pts_valor
        description: "0-30; NULL quando não há de-vig (Pinnacle ausente/incompleto)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - market_id
              - outcome_side
              - line_value

  - name: int_futebol_corroboracao
    description: >
      Fase 0 — corroboração externa (0-15) por (fixture_id, market_id, outcome_side,
      line_value): modelo_api_concorda (+7, só 1X2 nesta versão; base ÚNICA = ARGMAX das
      probabilidades da API -> no máx. 1 lado concorda por fixture) + linha_sharp_confirma
      (+8, reusado do devig).
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: market_id
        tests: [not_null]
      - name: outcome_side
        tests: [not_null]
      - name: pts_corroboracao
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - market_id
              - outcome_side
              - line_value

  - name: int_futebol_team_form_pit
    description: >
      Correção da Task 0 (look-ahead) — forma e tabela POINT-IN-TIME por (fixture_id, team_id):
      tudo calculado só com jogos FINALIZADOS da mesma competição/season e kickoff ANTERIOR ao do
      jogo-alvo. Substitui as duas fontes contaminadas dos 5 modelos de premissas: (A)
      fact_team_season_stats, que tem 1 snapshot por (time, liga, season) e em 2024/2025 é a
      temporada FECHADA aplicada à rodada 1 (played_total=38, ~51% de cada média sendo futuro,
      100% dos jogos com o próprio resultado dentro da média); e (B2) o standings_latest
      (MAX(snapshot_date) sem âncora no kickoff), cujo histórico só começa em 11/06/2026.
      Reconstrói do fact_fixtures as mesmas colunas consumidas (gols pró/contra casa/fora/total,
      clean sheet, failed to score, played/wins/draws) mais a tabela do campeonato no instante do
      jogo (rank/points/ppg/n_wins_last5/n_teams). O rank sai DENTRO do grupo (group_name das
      standings = estrutura do sorteio, conhecida antes dos jogos): pontos corridos = rank global
      1-20 (ou 1-36 na fase de liga da Champions); Libertadores/Sudamericana/Copa do Mundo = rank
      por grupo, igual à API; Copa do Brasil não tem standings -> rank NULL, como já era.
      Validado contra a tabela real da API (Brasileirão 2026): 56/63 pontos e 55/63 ranks exatos,
      erro médio de 0,27 posição — as diferenças são o snapshot diário estar defasado do kickoff.
      Em jogos FUTUROS o resultado é ~idêntico ao antigo (diferença média de 0,003 gol/jogo), ou
      seja, a correção muda o backtest e não mexe em produção.
      ⚠️ MEDIÇÃO (task [F], ADR 0007): o modelo aceita as vars pit_escopo (da_competicao|todas) e
      pit_recorte (temporada|ultimos_10), cujos DEFAULTS reproduzem exatamente o comportamento
      descrito acima — no default o SQL compilado é idêntico ao de antes de as vars existirem, e
      tests/assert_taskf_pit_default_igual_baseline prova a igualdade contra um baseline congelado
      antes delas. Produção nunca as passa; elas servem às células de medição, materializadas no
      dataset futebol_taskF (target `taskF`). A tabela do campeonato (rank/points/ppg/n_teams/
      goal_diff) NÃO segue os eixos: classificação existe dentro de uma competição, então ela
      permanece competição+temporada em todas as células, por construção (ADR 0008).
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: played_total
        description: "Jogos do time na competição/season ANTES do kickoff. 0 na estreia -> médias NULL -> premissa FALSE. Exposto p/ a recalibragem poder decidir um piso de amostra."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: rank
        description: "Posição na tabela (dentro do grupo) no instante do jogo. NULL sem standings (Copa do Brasil) ou antes da estreia."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: ppg
        description: "Pontos por jogo até o kickoff. NULL com played_total=0."
      - name: n_wins_last5
        description: "Vitórias nos 5 jogos anteriores ao kickoff. Substitui o parse de standings.form."
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id

  - name: int_futebol_player_importance
    description: >
      S7 — proxy de IMPORTÂNCIA de jogador (minutos x titularidade) p/ pesar desfalques no
      1X2. 1 linha por (player_id, competition_id), pooling todas as seasons (atributo estável,
      robusto na pausa FIFA de 2026). Fonte: fact_fixture_player_stats (jogos FT). is_important =
      total_minutes >= 450 (~5 jogos cheios) E start_share >= 0.5. Jogador sem stats (contratação
      nova / Copa) não aparece -> is_important FALSE no consumidor. Thresholds tunáveis (§13).
    columns:
      - name: player_id
        tests: [not_null]
      - name: competition_id
        tests: [not_null]
      - name: start_share
        description: "Fração das aparições em que começou jogando (starts/games), 0-1. NULL se games=0."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: is_important
        description: "Titular regular (total_minutes>=450 AND start_share>=0.5). Base do desfalque pesado por importância."
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - competition_id

  - name: int_futebol_desfalques
    description: >
      S7 — desfalques por (fixture, time, jogador) com TIPO (Missing Fixture/Questionable) +
      flag is_important. Artefato do aceite ("lista por time com tipo fora/dúvida e flag
      titular sim/não"). ⚠️ Correção da Task 0: (D) só entram snapshots COLETADOS ANTES DO APITO
      (extracted_at < kickoff_utc) — o log de /injuries da API é retroativo e 99,6% das ~174 mil
      linhas foram coletadas depois do jogo, inclusive de quem se machucou DURANTE a partida;
      essa assimetria (dado no backtest, ausente em produção) era o vazamento. Usa extracted_at
      e não snapshot_date porque o poll pré-jogo roda de hora em hora e no dia do jogo há coleta
      antes E depois do apito. Efeito: a premissa vai a FALSE em quase todo jogo passado e fica
      intacta p/ jogos futuros. (E) is_important virou POINT-IN-TIME (minutos/titularidades
      acumulados ANTES do kickoff, via window function sobre fact_fixture_player_stats), no lugar
      do pool de todas as seasons; is_important_pooled fica exposto p/ comparação. Dentro da
      janela pré-jogo, 1 linha por (fixture, team, player) preferindo Missing Fixture a
      Questionable (guard de double-count poll x season-log). Consumido por
      int_futebol_premissas_1x2 (só Missing Fixture AND is_important dispara). Só Brasileirão.
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_fixtures')
                field: fixture_id
              config:
                severity: warn
      - name: team_id
        tests: [not_null]
      - name: player_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
              config:
                severity: warn
      - name: injury_type
        description: "'Missing Fixture' (fora) | 'Questionable' (dúvida). Só Missing Fixture dispara o desfalque."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Missing Fixture', 'Questionable']
      - name: is_important
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
              - player_id

  - name: int_futebol_premissas_1x2
    description: >
      S1 — premissas de contexto do mercado Resultado (1X2). 3 linhas por fixture
      (Home/Draw/Away). 7 premissas (§12.1) + penalidades pick_empate/desfalque_proprio
      + evidencias[]/avisos[]. desfalque pesado por importância (S7): só titular importante
      fora (Missing Fixture AND is_important, via int_futebol_desfalques) dispara.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Draw', 'Away']
      - name: pts_premissas
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - outcome

  - name: int_futebol_premissas_ou
    description: >
      S2 — premissas de contexto do mercado Gols Over/Under (market_id 5). 2 linhas por
      (fixture, line_value): Over e Under, por linha L (canônicas 1.5/2.5/3.5 + linhas das
      odds). 7 premissas Over (§12.2, Σ56) + 6 Under (espelhadas, Σ52), com clamp ao teto 55
      (só o Over encosta); penalidade linha_extrema (L<=0,5 ou L>=4,5). Movimento de linha =
      consenso do mercado (média das PROBABILIDADES IMPLÍCITAS 1/odd de todas as casas, não de
      odds cruas), distinto da corroboração sharp da Pinnacle. last5 (historico_over/under) na
      MESMA season/competição anteriores ao jogo. evidencias[]/avisos[] = bullets pro front.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Over', 'Under']
      - name: line_value
        tests: [not_null]
      - name: pts_premissas
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - line_value
              - outcome

  - name: int_futebol_premissas_ah
    description: >
      S3 — premissas de contexto do mercado Handicap asiático (market_id 4). 2 linhas por
      (fixture, line_value): Home e Away. line_value = handicap na ótica do mandante (mesmo p/
      os dois lados; o par Home/Away é complementar). side_handicap = IF(Home, line, -line):
      <0 favorito (5 premissas, Σ40), >0 azarão (3 premissas, Σ30), =0 pick (nenhuma dispara).
      Penalidade handicap_alto (|line|>=2.5, -12). evidencias[]/avisos[] = bullets pro front.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Away']
      - name: line_value
        tests: [not_null]
      - name: pts_premissas
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - line_value
              - outcome

  - name: int_futebol_premissas_btts
    description: >
      S4 — premissas de contexto do mercado Ambos Marcam / BTTS (market_id 8). 2 linhas por
      fixture (Yes/No), sem line_value (como o 1X2). Sim: 4 premissas (§12.4, Σ34) — dois
      ataques ativos e defesas vazáveis; Não (espelho): 3 premissas (Σ28) — uma defesa forte
      ou um ataque que trava ("de um dos times" => OR). Σ por lado < 55 -> sem clamp. clean
      sheet%/failed-to-score% sobre o total da temporada; gols por venue; historico_btts/seco =
      últimos 5 jogos de cada (>=3 ~ 60%). Sem penalidade específica (só globais). evidencias[]/
      avisos[] pro front. No mart, BTTS usa de-vig de CONSENSO (Pinnacle não precifica BTTS).
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yes', 'No']
      - name: pts_premissas
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - outcome

  - name: int_futebol_premissas_dc
    description: >
      S5 — premissas de contexto do mercado Dupla Chance (market_id 12). 2 linhas por fixture:
      1X (mandante ou empate, S=Home) e X2 (empate ou visitante, S=Away). 4 premissas (§12.5,
      Σ34, sem clamp): lado_coberto_forte (reusa forca_mismatch/superioridade_tabela do 1X2),
      equilibrio_defensivo, adversario_limitado (reusa h2h_favoravel do 1X2), invicto_recente.
      equilibrio_defensivo/invicto_recente sobre jogos FINALIZADOS da MESMA season/competição
      anteriores ao jogo (season-bounded p/ não sangrar a temporada passada na pausa de off-season).
      O 12 (sem empate) não é produzido. Penalidade odd_muito_baixa e gate próprio (>=1,25, sem
      juice) ficam no mart. evidencias[]/avisos[] pro front.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1X', 'X2']
      - name: pts_premissas
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - outcome

# ============================================================================
# UNIT TESTS — regra do CONJUNTO DE SAÍDAS (issue #22)
#
# Primeiro unit test do repositório. Existe porque as guardas de dados sobre
# produção só provam o caso que produção JÁ TEM (linha de 1 saída); os outros
# dois — conjunto parcial de um mercado de 3 saídas e mercado não declarado —
# não existem na base hoje e ficariam verdes por vacuidade.
#
# As odds dão probabilidades EXATAS em ponto flutuante binário (0,5 / 0,25 /
# edge 0,0). Um 1X2 simétrico daria 1/3 e a asserção passaria a depender de
# arredondamento.
# ============================================================================
unit_tests:
  - name: conjunto_de_saidas_governa_a_emissao_de_valor
    model: int_futebol_odds_devig
    description: >
      Conjunto incompleto ou de mercado não declarado não produz prob justa pior —
      não produz nenhuma. Cobre as três fontes de valor: consenso (fixtures 1-4),
      mercado fora do mapa (fixture 5) e Pinnacle (fixtures 6-7), esta última sem
      nenhuma linha degenerada em produção hoje e portanto só demonstrável aqui.
    given:
      - input: ref('fact_odds_snapshot')
        rows:
          # (1) Gols com só o Over precificado -> o bug original: normalizava sobre
          #     uma saída e devolvia prob 1,0, edge = odd − 1 (aqui daria +200%).
          - {fixture_id: 1, market_id: 5, outcome_side: 'Over',  line_value: 2.5,  bookmaker_id: 6, bookmaker_name: 'Bwin', collection_window: 't15m', odd_decimal: 3.0}

          # (2) Gols com o par completo -> CONTROLE: a regra deixa passar o que deve.
          - {fixture_id: 2, market_id: 5, outcome_side: 'Over',  line_value: 2.5,  bookmaker_id: 6, bookmaker_name: 'Bwin', collection_window: 't15m', odd_decimal: 2.0}
          - {fixture_id: 2, market_id: 5, outcome_side: 'Under', line_value: 2.5,  bookmaker_id: 6, bookmaker_name: 'Bwin', collection_window: 't15m', odd_decimal: 2.0}

          # (3) 1X2 sem o empate -> o caso que "pelo menos 2 saídas" deixaria passar:
          #     booksum 0,75, probabilidades infladas, e SEM prob 1,0 para denunciar.
          - {fixture_id: 3, market_id: 1, outcome_side: 'Home',  line_value: null, bookmaker_id: 6, bookmaker_name: 'Bwin', collection_window: 't15m', odd_decimal: 2.0}
          - {fixture_id: 3, market_id: 1, outcome_side: 'Away',  line_value: null, bookmaker_id: 6, bookmaker_name: 'Bwin', collection_window: 't15m', odd_decimal: 4.0}

          # (4) 1X2 inteiro -> CONTROLE do conjunto de 3.
          - {fixture_id: 4, market_id: 1, outcome_side: 'Home',  line_value: null, bookmaker_id: 6, bookmaker_name: 'Bwin', collection_window: 't15m', odd_decimal: 2.0}
          - {fixture_id: 4, market_id: 1, outcome_side: 'Draw',  line_value: null, bookmaker_id: 6, bookmaker_name: 'Bwin', collection_window: 't15m', odd_decimal: 4.0}
          - {fixture_id: 4, market_id: 1, outcome_side: 'Away',  line_value: null, bookmaker_id: 6, bookmaker_name: 'Bwin', collection_window: 't15m', odd_decimal: 4.0}

          # (5) Mercado NÃO DECLARADO com par completo -> fail-closed: conjunto
          #     plausível não basta, o mercado precisa estar no mapa.
          - {fixture_id: 5, market_id: 99, outcome_side: 'Yes',  line_value: null, bookmaker_id: 6, bookmaker_name: 'Bwin', collection_window: 't15m', odd_decimal: 2.0}
          - {fixture_id: 5, market_id: 99, outcome_side: 'No',   line_value: null, bookmaker_id: 6, bookmaker_name: 'Bwin', collection_window: 't15m', odd_decimal: 2.0}

          # (6) PINNACLE com um lado só -> zero linhas assim em produção hoje, mas o
          #     de-vig da Pinnacle tem a mesma normalização e nunca teve guarda.
          - {fixture_id: 6, market_id: 4, outcome_side: 'Home',  line_value: -0.5, bookmaker_id: 4, bookmaker_name: 'Pinnacle', collection_window: 't15m', odd_decimal: 2.0}

          # (7) PINNACLE com o par completo -> CONTROLE: a âncora sharp segue intacta.
