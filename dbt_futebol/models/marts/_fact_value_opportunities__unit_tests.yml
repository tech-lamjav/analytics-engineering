version: 2

# ==============================================================================
# UNIT TESTS DO BOARD, DEPOIS DO FLIP (#97, A7-3).
#
# ⚠️ OS TRÊS MUDARAM DE INSUMO, E NENHUM MUDOU DE ASSERÇÃO. Até a #97 o mart
# reconstruía o Motor a partir de `int_futebol_odds_devig` + os cinco modelos de
# premissas + a corroboração, e era isso que estes testes mockavam. Depois do flip o
# mart LÊ `fact_value_funnel` — então o mock passou a ser o funil, e os cinco modelos
# de premissas sobraram apenas para `evidencias[]`/`avisos[]`, que a ADR 0011 deixou
# fora do funil de propósito.
#
# O que cada teste afirma é o mesmo de antes. Reescrever a asserção junto com o insumo
# transformaria um refactor num teste novo, e aí nenhum dos dois estaria provando que o
# board não mudou.
#
# ⚠️ E MUDOU O QUE ELES COBREM. Antes, o gate era aritmética DESTE modelo e os testes a
# exercitavam. Agora o gate é a coluna `passou_no_gate`, GRAVADA pelo funil: quem cobre
# a aritmética das portas são os unit tests do `fact_value_funnel`. O que sobra para o
# board — e é o que estes três medem — são as três coisas que só ele faz:
#
#   1. a JANELA DE DETECÇÃO sobre as quatro janelas do funil;
#   2. o EXPURGO, que é dele e não do funil (o funil guarda jogo encerrado de propósito);
#   3. a OBEDIÊNCIA ao `passou_no_gate` gravado — que o board não republique o que o
#      funil já reprovou, nem reavalie por conta própria.
# ==============================================================================

# ------------------------------------------------------------------------------
# Unit test da JANELA DE DETECÇÃO (#40, ADR 0004).
#
# Por que unit test e não data test: as três situações que a coluna existe para
# distinguir — detectada cedo e ainda viva, detectada cedo e já morta, nascida na
# janela corrente — são indistinguíveis numa contagem sobre produção. Um board em
# que toda `janela_deteccao` é igual a `janela_usada` é compatível tanto com "a
# coluna está certa e nenhuma oportunidade sobreviveu duas janelas" quanto com "a
# coluna está copiando janela_usada". Só linha construída separa as duas.
#
# Cada fixture isola um caso e muda UMA COISA SÓ em relação ao caso base:
#
#   1  passou em t24h e segue passando em t15m -> publica com deteccao=t24h
#   2  passou em t24h e NÃO passa em t15m -> fora do board
#   3  reprovou em t24h e só passou em t15m -> deteccao=t15m
#   4  passou em t24h, e a t15m é a janela corrente mas reprovou -> fora do board
#
# A fixture 4 é a que não é óbvia. Antes do flip ela testava que `janela_e_corrente`
# é carimbado sobre o de-vig CRU, e não recalculado depois dos filtros de completude:
# sem isso a t24h herdaria o posto de corrente e a linha seguiria no board exibindo o
# preço de ontem. Depois do flip a propriedade continua valendo e continua sendo testada,
# só que um degrau acima — o carimbo agora chega pronto do funil, e o que este caso
# prende é que o board NÃO promove a janela anterior quando a corrente reprova.
#
# As linhas do funil são deliberadamente idênticas fora do que cada caso move:
# pts_valor 30 + pts_premissas 15 = score 45 (faixa Média), a folga mínima confortável
# sobre o gate de 40. Se alguém mexer nesses pesos e o teste ficar vermelho por score,
# é o número daqui que se ajusta — não é o caso de teste que está errado.
# ------------------------------------------------------------------------------
unit_tests:
  - name: value_opportunities_janela_deteccao_e_a_mais_cedo_que_passou
    model: fact_value_opportunities
    description: >
      A janela de detecção é a janela mais cedo em que a linha passou no gate, e nunca
      é posterior à janela publicada. Linha que passou cedo e não passa na janela
      corrente não aparece no board.
    given:
      - input: ref('fact_value_funnel')
        rows:
          # -- fixture 1: passou nas duas. A t15m é a corrente; a t24h é a detecção. ---
          - {fixture_id: 1, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't24h', janela_prioridade: 2, janela_e_corrente: false, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}
          - {fixture_id: 1, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true,  competition: 'brasileirao', season: 2026, edge: 0.08, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.15, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}

          # -- fixture 2: o mercado corrigiu até o fechamento e a corrente reprovou. ---
          - {fixture_id: 2, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't24h', janela_prioridade: 2, janela_e_corrente: false, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}
          - {fixture_id: 2, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true,  competition: 'brasileirao', season: 2026, edge: -0.05, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 1.90, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: false}

          # -- fixture 3: em t24h o mercado ainda não estava líquido. Nasceu na corrente.
          - {fixture_id: 3, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't24h', janela_prioridade: 2, janela_e_corrente: false, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 2, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: false}
          - {fixture_id: 3, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true,  competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}

          # -- fixture 4: passou em t24h; a t15m É a corrente e reprovou. A t24h NÃO
          # herda o posto de corrente, e a linha some do board. Sem essa asserção o
          # board voltaria a publicar o preço de ontem.
          - {fixture_id: 4, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't24h', janela_prioridade: 2, janela_e_corrente: false, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}
          - {fixture_id: 4, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true,  competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 2, is_half_line: , passou_no_gate: false}

      # As arrays de exibição. format: sql porque `evidencias`/`avisos` são
      # ARRAY<STRING>, e o formato de dicionário entrega todo valor como escalar (o
      # cast de STRING p/ ARRAY falha).
      - input: ref('int_futebol_premissas_1x2')
        format: sql
        rows: |
          SELECT 1 AS fixture_id, 'Home' AS outcome,
                 CAST([] AS ARRAY<STRING>) AS evidencias,
                 CAST([] AS ARRAY<STRING>) AS avisos
          UNION ALL SELECT 2, 'Home', CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 3, 'Home', CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 4, 'Home', CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)

      - input: ref('int_futebol_premissas_ou')
        rows: []
      - input: ref('int_futebol_premissas_ah')
        rows: []
      - input: ref('int_futebol_premissas_btts')
        rows: []
      - input: ref('int_futebol_premissas_dc')
        rows: []

      # Os quatro entram como futuros e 'NS' de propósito: aqui se mede a JANELA DE
      # DETECÇÃO, e nenhuma linha pode morrer pela fronteira do board sem que a asserção
      # acima mude de significado em silêncio. A fronteira tem teste próprio, abaixo.
      - input: ref('fact_fixtures')
        format: sql
        rows: |
          SELECT id AS fixture_id, 'NS' AS status_short,
                 TIMESTAMP '2099-01-01 00:00:00+00' AS kickoff_utc
          FROM UNNEST([1,2,3,4]) AS id

    expect:
      rows:
        # fixture 1: publica a t15m (o preço que dá para pegar) e conta que a
        # oportunidade está no board desde a t24h.
        - {fixture_id: 1, market: 'match_winner', outcome: 'Home', janela_usada: 't15m', janela_deteccao: 't24h', score: 45, penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
        # fixture 3: nasceu na janela corrente — detecção e publicação coincidem.
        - {fixture_id: 3, market: 'match_winner', outcome: 'Home', janela_usada: 't15m', janela_deteccao: 't15m', score: 45, penalidades_globais_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false}
        # As fixtures 2 e 4 não aparecem: as duas reprovaram NA JANELA CORRENTE, e ter
        # valido em t24h não as devolve ao board.

  # ---------------------------------------------------------------------------
  # ⚠️ O EXPURGO É DO BOARD, E SÓ DELE — e é por isso que este teste é o mais
  # importante dos três depois do flip. O funil guarda jogo encerrado DE PROPÓSITO
  # (ADR 0011): é ele que responde quanto rendeu a faixa descartada. Um board filtrado
  # só por `janela_e_corrente AND passou_no_gate` voltaria a emitir jogo velho para
  # sempre — o defeito de 121 linhas com 2 jogos futuros que a #85 consertou,
  # reintroduzido pela porta dos fundos. Este teste é o que prende a terceira condição
  # do WHERE no lugar.
  # ---------------------------------------------------------------------------
  - name: value_opportunities_expurgo_a_fronteira_do_board
    model: fact_value_opportunities
    description: >
      A fronteira do expurgo (#85, ADR 0009) é o STATUS, não o relógio. Cobre as cinco
      formas de sair ou ficar, e a que mais importa é a terceira: PST/SUSP/INT sobrevivem
      INCLUSIVE além da carência — sem essa exceção a rede de 24 h expurgaria exatamente
      a linha que a decisão manda preservar.
    given:
      # Sete linhas de funil idênticas em tudo que não seja a fronteira: mesma nota,
      # mesmo preço, uma janela só, todas aprovadas no gate. O que as separa é só o par
      # (status, kickoff), então qualquer diferença no resultado é atribuível ao expurgo
      # e a mais nada.
      - input: ref('fact_value_funnel')
        rows:
          - {fixture_id: 10, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}
          - {fixture_id: 11, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}
          - {fixture_id: 12, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}
          - {fixture_id: 13, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}
          - {fixture_id: 14, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}
          - {fixture_id: 15, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}
          - {fixture_id: 16, market: 'match_winner', outcome: 'Home', line_value: , line_key: 'NONE', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 3, is_half_line: , passou_no_gate: true}

      # A FIXTURE 15 NÃO ESTÁ AQUI, e é de propósito: é o fail-open do LEFT JOIN
      # (ADR 0003). Fixture ausente não expurga a linha — quem grita nesse caso é a
      # guarda 1, com diagnóstico próprio, e não o sumiço silencioso da oportunidade.
      - input: ref('fact_fixtures')
        format: sql
        rows: |
          -- 10: jogo futuro, não começou. FICA.
          SELECT 10 AS fixture_id, 'NS' AS status_short,
                 TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL 6 HOUR) AS kickoff_utc
          -- 11: terminou. SAI por status terminal.
          UNION ALL SELECT 11, 'FT', TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 3 HOUR)
          -- 12: bola rolando. SAI — não se aposta pré-jogo com o jogo em curso.
          UNION ALL SELECT 12, '1H', TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 1 HOUR)
          -- 13: ADIADO há 10 dias. FICA, apesar de o kickoff ter passado MUITO da
          --     carência de 24 h. É a asserção central deste teste.
          UNION ALL SELECT 13, 'PST', TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 240 HOUR)
          -- 14: passou do apito há 48 h e nunca recebeu status final. SAI pela rede de
          --     segurança — é o sintoma de coleta de placar falha (task [C]).
          UNION ALL SELECT 14, 'NS', TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 48 HOUR)
          -- 16: o fixture EXISTE mas o status é NULL, e o apito foi há 48 h. SAI.
          --     Sem o COALESCE no braço do relógio, `NULL NOT IN (...)` devolveria NULL, o
          --     predicado inteiro viraria NULL e a linha ficaria no board PARA SEMPRE — e a
          --     guarda 1, que espelha o predicado, também não acenderia. É o caso literal
          --     que a rede de segurança existe para cobrir, e ele escapava por NULL.
          UNION ALL SELECT 16, CAST(NULL AS STRING),
                 TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 48 HOUR)

      - input: ref('int_futebol_premissas_1x2')
        format: sql
        rows: |
          SELECT id AS fixture_id, 'Home' AS outcome,
                 CAST([] AS ARRAY<STRING>) AS evidencias,
                 CAST([] AS ARRAY<STRING>) AS avisos
          FROM UNNEST([10,11,12,13,14,15,16]) AS id
      - input: ref('int_futebol_premissas_ou')
        rows: []
      - input: ref('int_futebol_premissas_ah')
        rows: []
      - input: ref('int_futebol_premissas_btts')
        rows: []
      - input: ref('int_futebol_premissas_dc')
        rows: []

    expect:
      rows:
        # 10 — jogo por acontecer.
        - {fixture_id: 10, market: 'match_winner', outcome: 'Home', score: 45}
        # 13 — adiado há 10 dias: sobrevive INCLUSIVE além da carência.
        - {fixture_id: 13, market: 'match_winner', outcome: 'Home', score: 45}
        # 15 — sem fixture: o fail-open deixa passar (ADR 0003), a guarda 1 acusa.
        - {fixture_id: 15, market: 'match_winner', outcome: 'Home', score: 45}
        # Não aparecem: 11 (terminal), 12 (ao vivo), 14 (carência) e 16 (status NULL
        # além da carência — o caso que escapava por NULL antes do COALESCE).
        #
        # A 15 e a 16 são o par que dá o desenho: as duas têm informação faltando, e
        # elas vão para lados OPOSTOS de propósito. Na 15 falta o jogo inteiro — é
        # defeito a montante, a linha fica e a guarda grita. Na 16 falta só o carimbo
        # do fim — é a ausência de placar que a carência existe para cobrir, e a linha
        # sai. "Não sei que jogo é este" e "sei qual é e ninguém carimbou o fim" não
        # podem ter o mesmo destino.

  # ---------------------------------------------------------------------------
  # O BOARD OBEDECE AO `passou_no_gate` GRAVADO — a asserção que nasce com o flip (#97).
  #
  # ⚠️ ESTE TESTE MUDOU DE PERGUNTA, e a mudança é a entrega. Até a #97 ele se chamava
  # `linha_de_quarto_nao_chega_ao_board` e exercitava o `futebol_e_linha_meia()` DENTRO
  # deste modelo, porque o board tinha um predicado de linha meia próprio (#101). Depois
  # do flip esse predicado não existe mais aqui: ele é a `porta_linha_meia` do funil, e
  # quem o cobre com linha construída é `funil_linha_meia_e_por_quarto_de_linha`.
  #
  # O que sobrou para o board — e é o que este caso agora prende — é mais fundamental:
  # **o board não reavalia nada.** Ele publica o que o funil aprovou e some com o que o
  # funil reprovou, sem opinião própria. Se alguém um dia reintroduzir aqui um `WHERE`
  # de porta "por segurança", este teste fica vermelho, porque a linha de quarto abaixo
  # chega com todos os componentes de uma linha publicável e só o `passou_no_gate`
  # dizendo não.
  #
  # A linha de quarto continua sendo o veículo do caso de propósito: é o defeito real da
  # #101, é a rejeição mais fácil de reintroduzir por engano, e mantém a continuidade com
  # o que este teste media antes.
  # ---------------------------------------------------------------------------
  - name: value_opportunities_respeita_o_gate_gravado_no_funil
    model: fact_value_opportunities
    description: >
      Três candidatos de Gols O/U idênticos fora da linha — cheia (2.0), de quarto (2.25)
      e meia (2.5) —, com o funil já tendo reprovado as duas primeiras. Só a meia é
      publicada, e o board chega a esse resultado LENDO o veredito, não recalculando-o.
    given:
      - input: ref('fact_value_funnel')
        rows:
          # linha CHEIA: pode dar push, o funil reprovou na porta_linha_meia.
          - {fixture_id: 20, market: 'goals_over_under', outcome: 'Over', line_value: 2.0, line_key: '2.0', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 2, is_half_line: false, passou_no_gate: false}
          # linha de QUARTO: meio-push. É a que passava antes da #101.
          - {fixture_id: 21, market: 'goals_over_under', outcome: 'Over', line_value: 2.25, line_key: '2.25', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 2, is_half_line: false, passou_no_gate: false}
          # linha MEIA: sem push. Aprovada.
          - {fixture_id: 22, market: 'goals_over_under', outcome: 'Over', line_value: 2.5, line_key: '2.5', janela: 't15m', janela_prioridade: 4, janela_e_corrente: true, competition: 'brasileirao', season: 2026, edge: 0.10, pts_valor: 30, pts_premissas: 15, premissas_sem_dado: 0, pts_corroboracao: 0, penalidades: 0, score: 45, best_odd: 2.20, best_book: 'Bet365', avg_odd: 2.00, n_casas: 5, prob_justa_fechamento: 0.50, valor_fonte: 'pinnacle', penalidades_globais_pts: 0, penalidades_especificas_pts: 0, pen_odd_outlier: false, pen_poucas_casas: false, pen_odd_longshot: false, pen_odd_juice: false, modelo_api_concorda: false, linha_sharp_confirma: false, pin_n_outcomes: 2, is_half_line: true, passou_no_gate: true}

      - input: ref('int_futebol_premissas_ou')
        format: sql
        rows: |
          SELECT 20 AS fixture_id, 'Over' AS outcome, 2.0 AS line_value,
                 CAST([] AS ARRAY<STRING>) AS evidencias,
                 CAST([] AS ARRAY<STRING>) AS avisos
          UNION ALL SELECT 21, 'Over', 2.25, CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)
          UNION ALL SELECT 22, 'Over', 2.5,  CAST([] AS ARRAY<STRING>), CAST([] AS ARRAY<STRING>)

      - input: ref('int_futebol_premissas_1x2')
        rows: []
      - input: ref('int_futebol_premissas_ah')
        rows: []
      - input: ref('int_futebol_premissas_btts')
        rows: []
      - input: ref('int_futebol_premissas_dc')
        rows: []

      # Os três futuros e 'NS': ninguém pode morrer pela fronteira do expurgo sem que
      # a asserção abaixo mude de significado em silêncio.
      - input: ref('fact_fixtures')
        format: sql
        rows: |
          SELECT id AS fixture_id, 'NS' AS status_short,
                 TIMESTAMP '2099-01-01 00:00:00+00' AS kickoff_utc
          FROM UNNEST([20,21,22]) AS id

    expect:
      rows:
        # Só a linha MEIA — a única que o funil aprovou. A cheia (20) e a de quarto (21)
        # chegam ao board com nota, preço e liquidez de linha publicável; o que as barra
        # é exclusivamente o veredito gravado.
        - {fixture_id: 22, market: 'goals_over_under', outcome: 'Over', line_value: 2.5, is_half_line: true, score: 45}
