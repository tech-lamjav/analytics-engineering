dbt_nba:
  outputs:
    dev:
      dataset: nba
      job_execution_timeout_seconds: 300
      job_retries: 1
      location: us-east1
      method: oauth
      priority: interactive
      project: smartbetting-dados
      threads: 4
      type: bigquery
    prod:
      type: bigquery
      method: oauth
      project: smartbetting-dados
      dataset: nba
      threads: 4
      location: us-east1

  target: dev

dbt_futebol:
  outputs:
    dev:
      dataset: futebol
      job_execution_timeout_seconds: 300
      job_retries: 1
      location: us-east1
      method: oauth
      priority: interactive
      project: smartbetting-dados
      threads: 4
      type: bigquery
    prod:
      type: bigquery
      method: oauth
      project: smartbetting-dados
      dataset: futebol
      threads: 4
      location: us-east1

    # Dataset de MEDICAO da task [F] (issue #49). Existe porque dev e prod apontam ambos para o
    # dataset de producao `futebol` e dev e o default: um `dbt run` sem --target publicaria
    # historico juntado no board. Nada agendado usa este target. Ver ADR 0007.
    taskF:
      type: bigquery
      method: oauth
      project: smartbetting-dados
      dataset: futebol_taskF
      threads: 4
      location: us-east1
      job_execution_timeout_seconds: 900
      job_retries: 1
      priority: interactive

  target: dev